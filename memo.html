<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Minimalist Memo</title>
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --card-active: #1e1e1e;
      --text-main: #ffffff;
      --text-sub: #8e8e93;
      --accent: #ffffff;
      --border: #262626;
      --danger: #ff453a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0 24px 0;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .btn-add {
      background: #ffffff;
      color: #000000;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .folder-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .folder-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: transform 0.1s ease;
    }

    .folder-card:active {
      background-color: var(--card-active);
      transform: scale(0.99);
    }

    .folder-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .folder-icon {
      font-size: 20px;
    }

    .folder-name {
      font-size: 16px;
      font-weight: 500;
    }

    .folder-count {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .folder-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 14px;
      padding: 6px 8px;
      border-radius: 8px;
      cursor: pointer;
    }

    .icon-btn:hover, .icon-btn:active {
      color: var(--text-main);
      background-color: rgba(255, 255, 255, 0.1);
    }

    .btn-delete:active {
      color: var(--danger);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 340px;
    }

    .modal h3 {
      margin-bottom: 16px;
      font-size: 18px;
    }

    .modal input {
      width: 100%;
      padding: 12px;
      background: #000000;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-main);
      font-size: 16px;
      margin-bottom: 20px;
      outline: none;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-btn {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel {
      background: transparent;
      color: var(--text-sub);
    }

    .btn-confirm {
      background: var(--text-main);
      color: #000000;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>폴더</h1>
      <button class="btn-add" onclick="openModal('add')">+ 새 폴더</button>
    </header>

    <div class="folder-list" id="folderList"></div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitle">새 폴더 생성</h3>
      <input type="text" id="folderInput" placeholder="폴더 이름을 입력하세요" />
      <div class="modal-buttons">
        <button class="modal-btn btn-cancel" onclick="closeModal()">취소</button>
        <button class="modal-btn btn-confirm" id="modalConfirmBtn">확인</button>
      </div>
    </div>
  </div>

  <script>
    // JSON 데이터 구조
    const STORAGE_KEY = 'OFFLINE_MEMO_FOLDERS';
    
    let folders = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
      { id: 'f1', name: '📌 기본 메모', items: [] },
      { id: 'f2', name: '💼 업무 노트', items: [] }
    ];

    let currentEditingId = null;

    function saveToLocalStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(folders));
      renderFolders();
    }

    function renderFolders() {
      const listEl = document.getElementById('folderList');
      listEl.innerHTML = '';

      folders.forEach((folder, index) => {
        const card = document.createElement('div');
        card.className = 'folder-card';
        card.innerHTML = `
          <div class="folder-info">
            <span class="folder-icon">📁</span>
            <div>
              <div class="folder-name">${escapeHtml(folder.name)}</div>
              <div class="folder-count">${folder.items.length}개의 메모</div>
            </div>
          </div>
          <div class="folder-actions">
            <button class="icon-btn" onclick="moveFolder(${index}, -1)" ${index === 0 ? 'style="opacity:0.2;"' : ''}>▲</button>
            <button class="icon-btn" onclick="moveFolder(${index}, 1)" ${index === folders.length - 1 ? 'style="opacity:0.2;"' : ''}>▼</button>
            <button class="icon-btn" onclick="openModal('rename', '${folder.id}')">✏️</button>
            <button class="icon-btn btn-delete" onclick="deleteFolder('${folder.id}')">🗑️</button>
          </div>
        `;
        listEl.appendChild(card);
      });
    }

    function openModal(mode, id = null) {
      const overlay = document.getElementById('modalOverlay');
      const input = document.getElementById('folderInput');
      const title = document.getElementById('modalTitle');
      const confirmBtn = document.getElementById('modalConfirmBtn');

      currentEditingId = id;
      overlay.classList.add('active');
      input.value = '';
      input.focus();

      if (mode === 'add') {
        title.innerText = '새 폴더 생성';
        confirmBtn.onclick = createFolder;
      } else {
        title.innerText = '폴더 이름 변경';
        const target = folders.find(f => f.id === id);
        if (target) input.value = target.name;
        confirmBtn.onclick = renameFolder;
      }
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function createFolder() {
      const name = document.getElementById('folderInput').value.trim();
      if (!name) return;
      
      folders.push({
        id: 'f_' + Date.now(),
        name: name,
        items: []
      });
      saveToLocalStorage();
      closeModal();
    }

    function renameFolder() {
      const name = document.getElementById('folderInput').value.trim();
      if (!name || !currentEditingId) return;

      const target = folders.find(f => f.id === currentEditingId);
      if (target) target.name = name;
      
      saveToLocalStorage();
      closeModal();
    }

    function deleteFolder(id) {
      if (confirm('폴더를 삭제하시겠습니까? 안의 내용도 함께 삭제됩니다.')) {
        folders = folders.filter(f => f.id !== id);
        saveToLocalStorage();
      }
    }

    function moveFolder(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= folders.length) return;

      const temp = folders[index];
      folders[index] = folders[newIndex];
      folders[newIndex] = temp;

      saveToLocalStorage();
    }

    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 초기 렌더링
    renderFolders();
  </script>
</body>
</html>
