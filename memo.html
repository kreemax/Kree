<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tree Structure Offline Memo</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(18, 18, 18, 0.85);
      --border: #2c2c2e;
      --text: #ffffff;
      --sub-text: #8e8e93;
      --accent: #ffffff;
      --line: #555555;
      --danger: #ff453a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: rgba(0, 0, 0, 0.4); /* 배경 이미지 시 글자 가독성 보장 */
      backdrop-filter: blur(2px);
    }

    /* Header Nav */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 12px;
      background: rgba(0, 0, 0, 0.8);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--border);
    }

    .nav-title {
      font-size: 18px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 120px;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      padding-right: 6px;
    }

    .action-btns {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      background: var(--text);
      color: #000000;
      border: none;
      padding: 5px 9px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-danger {
      background: var(--danger);
      color: #fff;
    }

    .content-area {
      padding: 16px;
      flex: 1;
      overflow-y: auto;
    }

    .section-title {
      font-size: 13px;
      color: var(--sub-text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 16px 0 8px 4px;
    }

    /* List Card */
    .list-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .list-card:active {
      background: rgba(255, 255, 255, 0.1);
    }

    .card-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      overflow: hidden;
    }

    .card-icon {
      font-size: 18px;
    }

    .card-text {
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-sub {
      font-size: 12px;
      color: var(--sub-text);
      margin-top: 2px;
    }

    .card-actions {
      display: flex;
      gap: 2px;
      align-items: center;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--sub-text);
      padding: 4px 5px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 6px;
    }

    .icon-btn:active {
      color: var(--text);
      background: rgba(255, 255, 255, 0.1);
    }

    /* Tree View */
    .tree-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0 60px 0;
      overflow-x: auto;
    }

    .tree, .tree ul, .tree li {
      list-style: none;
      margin: 0;
      padding: 0;
      position: relative;
    }

    .tree {
      display: flex;
      justify-content: center;
    }

    .tree ul {
      display: flex;
      padding-top: 20px;
      position: relative;
    }

    .tree ul::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      border-left: 2px solid var(--line);
      width: 0;
      height: 20px;
    }

    .tree li {
      float: left;
      text-align: center;
      list-style-type: none;
      position: relative;
      padding: 20px 8px 0 8px;
    }

    .tree li::before, .tree li::after {
      content: '';
      position: absolute;
      top: 0;
      right: 50%;
      border-top: 2px solid var(--line);
      width: 50%;
      height: 20px;
    }

    .tree li::after {
      right: auto;
      left: 50%;
      border-left: 2px solid var(--line);
    }

    .tree li:only-child::after, .tree li:only-child::before {
      display: none;
    }

    .tree li:only-child {
      padding-top: 0;
    }

    .tree li:first-child::before, .tree li:last-child::after {
      border: none;
    }

    .tree li:last-child::before {
      border-right: 2px solid var(--line);
      border-radius: 0 5px 0 0;
    }

    .tree li:first-child::after {
      border-radius: 5px 0 0 0;
    }

    /* Node Box */
    .node-box {
      border: 1px solid var(--accent);
      background: var(--card-bg);
      color: var(--text);
      padding: 10px 12px;
      display: inline-block;
      border-radius: 10px;
      min-width: 95px;
      max-width: 140px;
      position: relative;
      word-break: break-word;
      font-size: 13px;
      transition: background 0.2s, transform 0.1s;
      cursor: pointer;
    }

    .node-box:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.2);
    }

    .node-box.root-node {
      border: 2px solid var(--text);
      font-weight: bold;
      font-size: 15px;
      background: rgba(40, 40, 40, 0.9);
    }

    .node-has-content {
      font-size: 10px;
      color: var(--sub-text);
      margin-top: 4px;
    }

    .node-controls {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
    }

    .node-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .node-btn.del {
      color: var(--danger);
    }

    /* Editor View */
    .editor-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 90px);
      gap: 12px;
    }

    .editor-status {
      font-size: 12px;
      color: var(--sub-text);
    }

    .editor-title-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-size: 20px;
      font-weight: bold;
      padding: 8px 0;
      outline: none;
    }

    .editor-textarea {
      width: 100%;
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 16px;
      line-height: 1.6;
      resize: none;
    }

    /* Settings View */
    .settings-group {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .settings-input {
      width: 100%;
      padding: 10px 12px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .settings-btn {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .settings-btn:active {
      background: rgba(255, 255, 255, 0.1);
    }

    /* Map View Style */
    .map-container {
      padding: 8px 0;
    }

    .map-tree, .map-tree ul, .map-tree li {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .map-tree ul {
      margin-left: 18px;
      border-left: 1px dashed var(--line);
      padding-left: 10px;
    }

    .map-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      margin: 4px 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .map-item:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .map-item.folder { border-color: #555; font-weight: 600; }
    .map-item.memo { border-color: #333; }
    .map-item.node { background: transparent; border: none; padding: 2px 0; color: var(--sub-text); font-size: 12px; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #1c1c1e;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
    }

    .modal h3 { font-size: 16px; margin-bottom: 12px; }
    .modal input {
      width: 100%;
      padding: 10px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      margin-bottom: 16px;
      outline: none;
    }

    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header id="header"></header>
    <div class="content-area" id="content"></div>
  </div>

  <input type="file" id="jsonFileInput" style="display: none;" onchange="importJSON(event)" />
  <input type="file" id="bgFileInput" accept="image/*" style="display: none;" onchange="uploadBgImage(event)" />

  <!-- Global Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitle">입력</h3>
      <input type="text" id="modalInput" autofocus />
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn" id="modalConfirmBtn">확인</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'TREE_MEMO_APP_DATA_V6';

    let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      appTitle: '내 메모',
      bgImage: '',
      folders: [
        { id: 'f1', parentId: null, name: '📌 업무 프로젝트' }
      ],
      memos: [
        {
          id: 'm1',
          folderId: 'f1',
          title: '신규 시스템 구조도',
          tree: {
            id: 'n1',
            text: '신규 시스템',
            content: '여기는 메인 시스템의 상세설명입니다.',
            children: [
              {
                id: 'n2',
                text: '프론트엔드',
                content: '네모를 한번 터치하면 메모 내용과 제목을 언제든지 수정할 수 있습니다.',
                children: []
              }
            ]
          }
        }
      ]
    };

    if (!appData.appTitle) appData.appTitle = '내 메모';

    let currentView = 'HOME'; // 'HOME', 'FOLDER', 'MEMO', 'EDITOR', 'SETTINGS', 'MAP'
    let currentFolderId = null;
    let currentMemoId = null;
    let currentActiveNodeId = null;

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      applyBgImage();
    }

    function applyBgImage() {
      if (appData.bgImage) {
        document.body.style.backgroundImage = `url('${appData.bgImage}')`;
      } else {
        document.body.style.backgroundImage = 'none';
      }
    }

    function renderHeaderNav(titleHtml, parentFolderId = null) {
      return `
        <div style="display:flex; align-items:center;">
          ${parentFolderId !== undefined ? `<button class="back-btn" onclick="backFromFolder()">❮</button>` : ''}
          <div class="nav-title">${titleHtml}</div>
        </div>
        <div class="action-btns">
          <button class="btn btn-secondary" onclick="openSettings()">설정</button>
          <button class="btn btn-secondary" onclick="openMap()">지도</button>
          <button class="btn btn-secondary" onclick="openModal('createFolder', ${parentFolderId ? `'${parentFolderId}'` : 'null'})">+ 폴더</button>
          <button class="btn" onclick="openModal('createMemo', ${parentFolderId ? `'${parentFolderId}'` : 'null'})">+ 메모</button>
        </div>
      `;
    }

    function render() {
      applyBgImage();
      const header = document.getElementById('header');
      const content = document.getElementById('content');

      if (currentView === 'HOME') {
        header.innerHTML = renderHeaderNav(escapeHtml(appData.appTitle));

        let html = '';
        const rootFolders = appData.folders.filter(f => !f.parentId);
        const rootMemos = appData.memos.filter(m => !m.folderId);

        if (rootFolders.length === 0 && rootMemos.length === 0) {
          html = `<div style="color:var(--sub-text); font-size:13px; text-align:center; margin-top:40px;">폴더나 메모를 추가해보세요.</div>`;
        }

        // 폴더 목록
        rootFolders.forEach((f, idx) => {
          const subFolderCount = appData.folders.filter(sub => sub.parentId === f.id).length;
          const memoCount = appData.memos.filter(m => m.folderId === f.id).length;
          html += `
            <div class="list-card" onclick="openFolder('${f.id}')">
              <div class="card-info">
                <span class="card-icon">📁</span>
                <div>
                  <div class="card-text">${escapeHtml(f.name)}</div>
                  <div class="card-sub">${subFolderCount ? '폴더 ' + subFolderCount + '개 · ' : ''}메모 ${memoCount}개</div>
                </div>
              </div>
              <div class="card-actions">
                <button class="icon-btn" onclick="event.stopPropagation(); openModal('renameFolder', '${f.id}')">✏️</button>
                <button class="icon-btn" onclick="event.stopPropagation(); moveFolder(null, ${idx}, -1)">▲</button>
                <button class="icon-btn" onclick="event.stopPropagation(); moveFolder(null, ${idx}, 1)">▼</button>
                <button class="icon-btn" onclick="event.stopPropagation(); deleteFolder('${f.id}')">🗑️</button>
              </div>
            </div>
          `;
        });

        // 메모 목록
        rootMemos.forEach((m, idx) => {
          html += `
            <div class="list-card" onclick="openMemo('${m.id}')">
              <div class="card-info">
                <span class="card-icon">📄</span>
                <div class="card-text">${escapeHtml(m.title)}</div>
              </div>
              <div class="card-actions">
                <button class="icon-btn" onclick="event.stopPropagation(); openModal('renameMemo', '${m.id}')">✏️</button>
                <button class="icon-btn" onclick="event.stopPropagation(); moveMemo(null, ${idx}, -1)">▲</button>
                <button class="icon-btn" onclick="event.stopPropagation(); moveMemo(null, ${idx}, 1)">▼</button>
                <button class="icon-btn" onclick="event.stopPropagation(); deleteMemo('${m.id}')">🗑️</button>
              </div>
            </div>
          `;
        });

        content.innerHTML = html;

      } else if (currentView === 'FOLDER') {
        const folder = appData.folders.find(f => f.id === currentFolderId);
        header.innerHTML = renderHeaderNav(escapeHtml(folder ? folder.name : '폴더'), currentFolderId);

        const subFolders = appData.folders.filter(f => f.parentId === currentFolderId);
        const folderMemos = appData.memos.filter(m => m.folderId === currentFolderId);

        let html = '';
        if (subFolders.length === 0 && folderMemos.length === 0) {
          html = `<div style="color:var(--sub-text); font-size:13px; text-align:center; margin-top:40px;">이 폴더는 비어 있습니다.</div>`;
        }

        // 하위 폴더 목록
        subFolders.forEach((f, idx) => {
          const subFolderCount = appData.folders.filter(sub => sub.parentId === f.id).length;
          const memoCount = appData.memos.filter(m => m.folderId === f.id).length;
          html += `
            <div class="list-card" onclick="openFolder('${f.id}')">
              <div class="card-info">
                <span class="card-icon">📁</span>
                <div>
                  <div class="card-text">${escapeHtml(f.name)}</div>
                  <div class="card-sub">${subFolderCount ? '폴더 ' + subFolderCount + '개 · ' : ''}메모 ${memoCount}개</div>
                </div>
              </div>
              <div class="card-actions">
                <button class="icon-btn" onclick="event.stopPropagation(); openModal('renameFolder', '${f.id}')">✏️</button>
                <button class="icon-btn" onclick="event.stopPropagation(); moveFolder('${currentFolderId}', ${idx}, -1)">▲</button>
                <button class="icon-btn" onclick="event.stopPropagation(); moveFolder('${currentFolderId}', ${idx}, 1)">▼</button>
                <button class="icon-btn" onclick="event.stopPropagation(); deleteFolder('${f.id}')">🗑️</button>
              </div>
            </div>
          `;
        });

        // 내부 메모 목록
        folderMemos.forEach((m, idx) => {
          html += `
            <div class="list-card" onclick="openMemo('${m.id}')">
              <div class="card-info">
                <span class="card-icon">📄</span>
                <div class="card-text">${escapeHtml(m.title)}</div>
              </div>
              <div class="card-actions">
                <button class="icon-btn" onclick="event.stopPropagation(); openModal('renameMemo', '${m.id}')">✏️</button>
                <button class="icon-btn" onclick="event.stopPropagation(); moveMemo('${currentFolderId}', ${idx}, -1)">▲</button>
                <button class="icon-btn" onclick="event.stopPropagation(); moveMemo('${currentFolderId}', ${idx}, 1)">▼</button>
                <button class="icon-btn" onclick="event.stopPropagation(); deleteMemo('${m.id}')">🗑️</button>
              </div>
            </div>
          `;
        });

        content.innerHTML = html;

      } else if (currentView === 'MEMO') {
        const memo = appData.memos.find(m => m.id === currentMemoId);
        header.innerHTML = `
          <div style="display:flex; align-items:center;">
            <button class="back-btn" onclick="backFromMemo()">❮</button>
            <div class="nav-title">${escapeHtml(memo ? memo.title : '메모')}</div>
          </div>
        `;

        if (memo) {
          content.innerHTML = `
            <div style="text-align:center; color:var(--sub-text); font-size:11px; margin-bottom: 5px;">
              💡 <b>네모 터치:</b> 메모 들어가기 & 제목/본문 작성
            </div>
            <div class="tree-container">
              <div class="tree">
                <ul>
                  ${renderTreeNode(memo.tree, true)}
                </ul>
              </div>
            </div>
          `;
        }
      } else if (currentView === 'EDITOR') {
        const node = findNodeById(currentMemoId, currentActiveNodeId);
        header.innerHTML = `
          <div style="display:flex; align-items:center;">
            <button class="back-btn" onclick="backToTree()">❮</button>
            <div class="nav-title">메모 수정</div>
          </div>
        `;

        content.innerHTML = `
          <div class="editor-container">
            <div class="editor-status" id="saveStatus">실시간 자동저장 중...</div>
            <input type="text" class="editor-title-input" id="nodeTitleEditor" value="${node ? escapeHtml(node.text) : ''}" placeholder="제목 입력" />
            <textarea class="editor-textarea" id="nodeContentEditor" placeholder="여기에 메모 내용을 입력하세요...">${node && node.content ? escapeHtml(node.content) : ''}</textarea>
          </div>
        `;

        setTimeout(() => {
          const titleInput = document.getElementById('nodeTitleEditor');
          const textarea = document.getElementById('nodeContentEditor');

          if (titleInput && textarea) {
            const handleInput = () => {
              if (node) {
                const newTitle = titleInput.value.trim() || '제목 없음';
                node.text = newTitle;
                node.content = textarea.value;

                const memo = appData.memos.find(m => m.id === currentMemoId);
                if (memo && memo.tree.id === node.id) {
                  memo.title = newTitle;
                }

                saveData();
                document.getElementById('saveStatus').innerText = '저장됨 ✓';
              }
            };

            titleInput.oninput = handleInput;
            textarea.oninput = handleInput;
          }
        }, 50);

      } else if (currentView === 'SETTINGS') {
        header.innerHTML = `
          <div style="display:flex; align-items:center;">
            <button class="back-btn" onclick="goHome()">❮</button>
            <div class="nav-title">설정</div>
          </div>
        `;

        content.innerHTML = `
          <div class="section-title">앱 타이틀 설정</div>
          <div class="settings-group">
            <input type="text" class="settings-input" id="appTitleInput" value="${escapeHtml(appData.appTitle)}" placeholder="메인화면 제목 입력" />
            <button class="btn" style="width: 100%; padding: 10px;" onclick="updateAppTitle()">타이틀 저장</button>
          </div>

          <div class="section-title" style="margin-top: 20px;">배경 이미지 설정</div>
          <div class="settings-group">
            <button class="settings-btn" onclick="triggerBgFileInput()">
              🖼️ 배경 이미지 선택하기
            </button>
            ${appData.bgImage ? `<button class="settings-btn" style="color:var(--danger);" onclick="removeBgImage()">❌ 배경 이미지 삭제</button>` : ''}
          </div>

          <div class="section-title" style="margin-top: 20px;">데이터 백업 및 복원</div>
          <div class="settings-group">
            <button class="settings-btn" onclick="exportJSON()">
              📤 JSON 데이터 내보내기 (백업)
            </button>
            <button class="settings-btn" onclick="triggerFileInput()">
              📥 JSON 데이터 불러오기 (복원)
            </button>
          </div>

          <div class="section-title" style="margin-top: 20px; color: var(--danger);">위험 구역</div>
          <div class="settings-group" style="border-color: rgba(255, 69, 58, 0.4);">
            <button class="settings-btn" style="background: rgba(255, 69, 58, 0.15); color: var(--danger);" onclick="clearAllData()">
              🔥 모든 데이터 초기화 (전체 삭제)
            </button>
          </div>
        `;
      } else if (currentView === 'MAP') {
        header.innerHTML = `
          <div style="display:flex; align-items:center;">
            <button class="back-btn" onclick="goHome()">❮</button>
            <div class="nav-title">전체 구조 지도</div>
          </div>
        `;

        content.innerHTML = `
          <div class="map-container">
            <div style="font-size:12px; color:var(--sub-text); margin-bottom:12px;">💡 폴더나 메모를 터치하면 해당 위치로 이동합니다.</div>
            <div class="map-tree">
              ${renderMapStructure(null)}
            </div>
          </div>
        `;
      }
    }

    /* 전체 지도 트리 생성 */
    function renderMapStructure(parentId) {
      const folders = appData.folders.filter(f => f.parentId === parentId);
      const memos = appData.memos.filter(m => m.folderId === parentId);

      if (folders.length === 0 && memos.length === 0) return '';

      let html = '<ul>';

      folders.forEach(f => {
        html += `
          <li>
            <div class="map-item folder" onclick="openFolder('${f.id}')">
              📁 <span>${escapeHtml(f.name)}</span>
            </div>
            ${renderMapStructure(f.id)}
          </li>
        `;
      });

      memos.forEach(m => {
        html += `
          <li>
            <div class="map-item memo" onclick="openMemo('${m.id}')">
              📄 <span>${escapeHtml(m.title)}</span>
            </div>
            ${renderMapNodeTree(m.tree)}
          </li>
        `;
      });

      html += '</ul>';
      return html;
    }

    function renderMapNodeTree(node) {
      if (!node || !node.children || node.children.length === 0) return '';
      let html = '<ul>';
      node.children.forEach(c => {
        html += `
          <li>
            <div class="map-item node">
              └ <span>${escapeHtml(c.text)}</span>
            </div>
            ${renderMapNodeTree(c)}
          </li>
        `;
      });
      html += '</ul>';
      return html;
    }

    function renderTreeNode(node, isRoot = false) {
      const hasChildren = node.children && node.children.length > 0;
      const hasContent = node.content && node.content.trim().length > 0;

      let html = `<li>`;
      html += `
        <div class="node-box ${isRoot ? 'root-node' : ''}" onclick="openTextEditor('${node.id}')">
          <div>${escapeHtml(node.text)}</div>
          ${hasContent ? `<div class="node-has-content">📝 내용 있음</div>` : ''}
          <div class="node-controls" onclick="event.stopPropagation()">
            <button class="node-btn" onclick="openModal('addChild', '${node.id}')">+</button>
            ${!isRoot ? `<button class="node-btn del" onclick="deleteNode('${node.id}')">✕</button>` : ''}
          </div>
        </div>
      `;

      if (hasChildren) {
        html += `<ul>`;
        node.children.forEach(child => {
          html += renderTreeNode(child, false);
        });
        html += `</ul>`;
      }

      html += `</li>`;
      return html;
    }

    /* 이미지 배경 처리 */
    function triggerBgFileInput() {
      document.getElementById('bgFileInput').click();
    }

    function uploadBgImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        appData.bgImage = e.target.result;
        saveData();
        render();
      };
      reader.readAsDataURL(file);
    }

    function removeBgImage() {
      appData.bgImage = '';
      saveData();
      render();
    }

    /* 설정 기능들 */
    function updateAppTitle() {
      const input = document.getElementById('appTitleInput');
      if (input) {
        const val = input.value.trim();
        appData.appTitle = val || '내 메모';
        saveData();
        alert('메인 화면 타이틀이 변경되었습니다.');
      }
    }

    function clearAllData() {
      if (confirm('정말로 모든 폴더, 메모 및 설정을 삭제하시겠습니까?')) {
        if (confirm('삭제된 데이터는 복구할 수 없습니다. 계속하시겠습니까?')) {
          localStorage.removeItem(STORAGE_KEY);
          appData = {
            appTitle: '내 메모',
            bgImage: '',
            folders: [],
            memos: []
          };
          saveData();
          alert('모든 데이터가 초기화되었습니다.');
          goHome();
        }
      }
    }

    /* 순서 변경 기능 */
    function moveFolder(parentId, index, direction) {
      const filteredFolders = appData.folders.filter(f => f.parentId === parentId);
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= filteredFolders.length) return;

      const item1 = filteredFolders[index];
      const item2 = filteredFolders[targetIndex];

      const idx1 = appData.folders.findIndex(f => f.id === item1.id);
      const idx2 = appData.folders.findIndex(f => f.id === item2.id);

      const temp = appData.folders[idx1];
      appData.folders[idx1] = appData.folders[idx2];
      appData.folders[idx2] = temp;

      saveData();
      render();
    }

    function moveMemo(folderId, index, direction) {
      const filteredMemos = appData.memos.filter(m => m.folderId === folderId);
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= filteredMemos.length) return;

      const item1 = filteredMemos[index];
      const item2 = filteredMemos[targetIndex];

      const idx1 = appData.memos.findIndex(m => m.id === item1.id);
      const idx2 = appData.memos.findIndex(m => m.id === item2.id);

      const temp = appData.memos[idx1];
      appData.memos[idx1] = appData.memos[idx2];
      appData.memos[idx2] = temp;

      saveData();
      render();
    }

    /* JSON 백업/복원 */
    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `memo_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerFileInput() {
      const fileInput = document.getElementById('jsonFileInput');
      fileInput.value = '';
      fileInput.click();
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (importedData && importedData.folders && importedData.memos) {
            appData = importedData;
            if (!appData.appTitle) appData.appTitle = '내 메모';
            saveData();
            alert('데이터를 성공적으로 불러왔습니다!');
            goHome();
          } else {
            alert('올바른 백업 파일 형식이 아닙니다.');
          }
        } catch (err) {
          alert('파일을 읽는 중 오류가 발생했습니다.');
        }
      };
      reader.readAsText(file);
    }

    // Navigation Helpers
    function goHome() { currentView = 'HOME'; currentFolderId = null; render(); }
    function openFolder(fId) { currentView = 'FOLDER'; currentFolderId = fId; render(); }
    function openMap() { currentView = 'MAP'; render(); }
    function backFromFolder() {
      const folder = appData.folders.find(f => f.id === currentFolderId);
      if (folder && folder.parentId) {
        currentFolderId = folder.parentId;
      } else {
        currentView = 'HOME';
        currentFolderId = null;
      }
      render();
    }
    function openMemo(mId) { currentView = 'MEMO'; currentMemoId = mId; render(); }
    function openSettings() { currentView = 'SETTINGS'; render(); }
    function backFromMemo() {
      if (currentFolderId) currentView = 'FOLDER';
      else currentView = 'HOME';
      render();
    }
    function openTextEditor(nodeId) {
      currentActiveNodeId = nodeId;
      currentView = 'EDITOR';
      render();
    }
    function backToTree() {
      currentView = 'MEMO';
      render();
    }

    function findNodeById(memoId, nodeId) {
      const memo = appData.memos.find(m => m.id === memoId);
      if (!memo) return null;

      function search(node) {
        if (node.id === nodeId) return node;
        if (node.children) {
          for (let child of node.children) {
            const found = search(child);
            if (found) return found;
          }
        }
        return null;
      }
      return search(memo.tree);
    }

    // Data Actions
    function deleteFolder(fId) {
      if (confirm('폴더와 내부에 포함된 모든 하위 폴더 및 메모가 삭제됩니다.')) {
        function collectFolderIds(targetId) {
          let ids = [targetId];
          const subs = appData.folders.filter(f => f.parentId === targetId);
          subs.forEach(s => {
            ids = ids.concat(collectFolderIds(s.id));
          });
          return ids;
        }

        const deleteTargetIds = collectFolderIds(fId);
        appData.folders = appData.folders.filter(f => !deleteTargetIds.includes(f.id));
        appData.memos = appData.memos.filter(m => !deleteTargetIds.includes(m.folderId));

        saveData();
        render();
      }
    }

    function deleteMemo(mId) {
      if (confirm('메모를 삭제하시겠습니까?')) {
        appData.memos = appData.memos.filter(m => m.id !== mId);
        saveData();
        render();
      }
    }

    function deleteNode(nodeId) {
      const memo = appData.memos.find(m => m.id === currentMemoId);
      if (!memo) return;

      function removeRecursive(parent) {
        if (!parent.children) return;
        parent.children = parent.children.filter(c => c.id !== nodeId);
        parent.children.forEach(c => removeRecursive(c));
      }

      removeRecursive(memo.tree);
      saveData();
      render();
    }

    // Modal
    let modalCallback = null;
    function openModal(type, targetId = null) {
      const overlay = document.getElementById('modalOverlay');
      const title = document.getElementById('modalTitle');
      const input = document.getElementById('modalInput');
      const confirmBtn = document.getElementById('modalConfirmBtn');

      overlay.classList.add('active');
      input.value = '';
      input.focus();

      if (type === 'createFolder') {
        title.innerText = '새 폴더 생성';
        modalCallback = () => {
          const val = input.value.trim();
          if (val) {
            appData.folders.push({ id: 'f_' + Date.now(), parentId: targetId, name: val });
            saveData();
            render();
          }
        };
      } else if (type === 'renameFolder') {
        title.innerText = '폴더 이름 변경';
        const folder = appData.folders.find(f => f.id === targetId);
        if (folder) input.value = folder.name;

        modalCallback = () => {
          const val = input.value.trim();
          if (val && folder) {
            folder.name = val;
            saveData();
            render();
          }
        };
      } else if (type === 'renameMemo') {
        title.innerText = '메모 이름 변경';
        const memo = appData.memos.find(m => m.id === targetId);
        if (memo) input.value = memo.title;

        modalCallback = () => {
          const val = input.value.trim();
          if (val && memo) {
            memo.title = val;
            if (memo.tree) memo.tree.text = val;
            saveData();
            render();
          }
        };
      } else if (type === 'createMemo') {
        title.innerText = '새 메모 생성 (제목)';
        modalCallback = () => {
          const val = input.value.trim();
          if (val) {
            const newMemo = {
              id: 'm_' + Date.now(),
              folderId: targetId,
              title: val,
              tree: { id: 'n_' + Date.now(), text: val, content: '', children: [] }
            };
            appData.memos.push(newMemo);
            saveData();
            openMemo(newMemo.id);
          }
        };
      } else if (type === 'addChild') {
        title.innerText = '하위 단계 노드 추가';
        modalCallback = () => {
          const val = input.value.trim();
          if (val) {
            const memo = appData.memos.find(m => m.id === currentMemoId);
            function addRecursive(node) {
              if (node.id === targetId) {
                if (!node.children) node.children = [];
                node.children.push({ id: 'n_' + Date.now(), text: val, content: '', children: [] });
                return true;
              }
              if (node.children) {
                for (let child of node.children) {
                  if (addRecursive(child)) return true;
                }
              }
              return false;
            }
            addRecursive(memo.tree);
            saveData();
            render();
          }
        };
      }

      confirmBtn.onclick = () => {
        if (modalCallback) modalCallback();
        closeModal();
      };
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function escapeHtml(str) {
      return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }

    // Init
    render();
  </script>
</body>
</html>
