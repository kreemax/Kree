<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tree Structure Offline Memo</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: #121212;
      --border: #2c2c2e;
      --text: #ffffff;
      --sub-text: #8e8e93;
      --accent: #ffffff;
      --line: #444444;
      --danger: #ff453a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Header Nav */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 16px;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--border);
    }

    .nav-title {
      font-size: 20px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 20px;
      cursor: pointer;
      padding-right: 8px;
    }

    .action-btns {
      display: flex;
      gap: 8px;
    }

    .btn {
      background: var(--text);
      color: #000000;
      border: none;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .content-area {
      padding: 16px;
      flex: 1;
      overflow-y: auto;
    }

    .section-title {
      font-size: 13px;
      color: var(--sub-text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 16px 0 8px 4px;
    }

    /* Folder & Memo List Card */
    .list-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .list-card:active {
      background: #1c1c1e;
    }

    .card-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .card-icon {
      font-size: 18px;
    }

    .card-text {
      font-size: 15px;
      font-weight: 500;
    }

    .card-sub {
      font-size: 12px;
      color: var(--sub-text);
      margin-top: 2px;
    }

    .card-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--sub-text);
      padding: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    /* Tree View */
    .tree-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0 60px 0;
      overflow-x: auto;
    }

    .tree, .tree ul, .tree li {
      list-style: none;
      margin: 0;
      padding: 0;
      position: relative;
    }

    .tree {
      display: flex;
      justify-content: center;
    }

    .tree ul {
      display: flex;
      padding-top: 20px;
      position: relative;
    }

    .tree ul::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      border-left: 2px solid var(--line);
      width: 0;
      height: 20px;
    }

    .tree li {
      float: left;
      text-align: center;
      list-style-type: none;
      position: relative;
      padding: 20px 8px 0 8px;
    }

    .tree li::before, .tree li::after {
      content: '';
      position: absolute;
      top: 0;
      right: 50%;
      border-top: 2px solid var(--line);
      width: 50%;
      height: 20px;
    }

    .tree li::after {
      right: auto;
      left: 50%;
      border-left: 2px solid var(--line);
    }

    .tree li:only-child::after, .tree li:only-child::before {
      display: none;
    }

    .tree li:only-child {
      padding-top: 0;
    }

    .tree li:first-child::before, .tree li:last-child::after {
      border: none;
    }

    .tree li:last-child::before {
      border-right: 2px solid var(--line);
      border-radius: 0 5px 0 0;
    }

    .tree li:first-child::after {
      border-radius: 5px 0 0 0;
    }

    /* Node Box */
    .node-box {
      border: 1px solid var(--accent);
      background: var(--card-bg);
      color: var(--text);
      padding: 10px 12px;
      display: inline-block;
      border-radius: 10px;
      min-width: 95px;
      max-width: 140px;
      position: relative;
      word-break: break-word;
      font-size: 13px;
      transition: background 0.2s, transform 0.1s;
      cursor: pointer;
    }

    .node-box:active {
      transform: scale(0.96);
      background: #222222;
    }

    .node-box.root-node {
      border: 2px solid var(--text);
      font-weight: bold;
      font-size: 15px;
      background: #1e1e1e;
    }

    .node-has-content {
      font-size: 10px;
      color: var(--sub-text);
      margin-top: 4px;
    }

    .node-controls {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
    }

    .node-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .node-btn.del {
      color: var(--danger);
    }

    /* Editor View */
    .editor-container {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 90px);
      gap: 12px;
    }

    .editor-status {
      font-size: 12px;
      color: var(--sub-text);
    }

    .editor-title-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-size: 20px;
      font-weight: bold;
      padding: 8px 0;
      outline: none;
    }

    .editor-textarea {
      width: 100%;
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 16px;
      line-height: 1.6;
      resize: none;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 100;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
    }

    .modal h3 { font-size: 16px; margin-bottom: 12px; }
    .modal input {
      width: 100%;
      padding: 10px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      margin-bottom: 16px;
      outline: none;
    }

    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header id="header"></header>
    <div class="content-area" id="content"></div>
  </div>

  <!-- Global Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitle">입력</h3>
      <input type="text" id="modalInput" autofocus />
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn" id="modalConfirmBtn">확인</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'TREE_MEMO_APP_DATA_V3';

    let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      folders: [
        { id: 'f1', name: '📌 업무 프로젝트' }
      ],
      memos: [
        {
          id: 'm1',
          folderId: 'f1',
          title: '신규 시스템 구조도',
          tree: {
            id: 'n1',
            text: '신규 시스템',
            content: '여기는 메인 시스템의 상세설명입니다.\n제목과 본문을 자유롭게 수정해 보세요.',
            children: [
              {
                id: 'n2',
                text: '프론트엔드',
                content: '네모를 한번 터치하면 메모 내용과 제목을 언제든지 수정할 수 있습니다.',
                children: []
              }
            ]
          }
        }
      ]
    };

    let currentView = 'HOME'; // 'HOME', 'FOLDER', 'MEMO', 'EDITOR'
    let currentFolderId = null;
    let currentMemoId = null;
    let currentActiveNodeId = null;

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    function render() {
      const header = document.getElementById('header');
      const content = document.getElementById('content');

      if (currentView === 'HOME') {
        header.innerHTML = `
          <div class="nav-title">내 메모</div>
          <div class="action-btns">
            <button class="btn btn-secondary" onclick="openModal('createFolder')">+ 폴더</button>
            <button class="btn" onclick="openModal('createMemo', null)">+ 메모</button>
          </div>
        `;

        let html = `<div class="section-title">폴더</div>`;
        if (appData.folders.length === 0) {
          html += `<div style="color:var(--sub-text); font-size:13px; padding:8px 4px;">생성된 폴더가 없습니다.</div>`;
        }
        appData.folders.forEach(f => {
          const count = appData.memos.filter(m => m.folderId === f.id).length;
          html += `
            <div class="list-card" onclick="openFolder('${f.id}')">
              <div class="card-info">
                <span class="card-icon">📁</span>
                <div>
                  <div class="card-text">${escapeHtml(f.name)}</div>
                  <div class="card-sub">${count}개의 메모</div>
                </div>
              </div>
              <div class="card-actions">
                <button class="icon-btn" onclick="event.stopPropagation(); deleteFolder('${f.id}')">🗑️</button>
              </div>
            </div>
          `;
        });

        html += `<div class="section-title">메인 메모 (미분류)</div>`;
        const rootMemos = appData.memos.filter(m => !m.folderId);
        if (rootMemos.length === 0) {
          html += `<div style="color:var(--sub-text); font-size:13px; padding:8px 4px;">메모가 없습니다.</div>`;
        }
        rootMemos.forEach(m => {
          html += `
            <div class="list-card" onclick="openMemo('${m.id}')">
              <div class="card-info">
                <span class="card-icon">📄</span>
                <div class="card-text">${escapeHtml(m.title)}</div>
              </div>
              <div class="card-actions">
                <button class="icon-btn" onclick="event.stopPropagation(); deleteMemo('${m.id}')">🗑️</button>
              </div>
            </div>
          `;
        });

        content.innerHTML = html;

      } else if (currentView === 'FOLDER') {
        const folder = appData.folders.find(f => f.id === currentFolderId);
        header.innerHTML = `
          <div style="display:flex; align-items:center;">
            <button class="back-btn" onclick="goHome()">❮</button>
            <div class="nav-title">${escapeHtml(folder ? folder.name : '폴더')}</div>
          </div>
          <div class="action-btns">
            <button class="btn" onclick="openModal('createMemo', '${currentFolderId}')">+ 메모</button>
          </div>
        `;

        const folderMemos = appData.memos.filter(m => m.folderId === currentFolderId);
        let html = '';
        if (folderMemos.length === 0) {
          html = `<div style="color:var(--sub-text); font-size:13px; text-align:center; margin-top:40px;">이 폴더에 메모가 없습니다.</div>`;
        }
        folderMemos.forEach(m => {
          html += `
            <div class="list-card" onclick="openMemo('${m.id}')">
              <div class="card-info">
                <span class="card-icon">📄</span>
                <div class="card-text">${escapeHtml(m.title)}</div>
              </div>
              <div class="card-actions">
                <button class="icon-btn" onclick="event.stopPropagation(); deleteMemo('${m.id}')">🗑️</button>
              </div>
            </div>
          `;
        });

        content.innerHTML = html;

      } else if (currentView === 'MEMO') {
        const memo = appData.memos.find(m => m.id === currentMemoId);
        header.innerHTML = `
          <div style="display:flex; align-items:center;">
            <button class="back-btn" onclick="backFromMemo()">❮</button>
            <div class="nav-title">${escapeHtml(memo ? memo.title : '메모')}</div>
          </div>
        `;

        if (memo) {
          content.innerHTML = `
            <div style="text-align:center; color:var(--sub-text); font-size:11px; margin-bottom: 5px;">
              💡 <b>네모 터치:</b> 메모 들어가기 & 제목/본문 작성
            </div>
            <div class="tree-container">
              <div class="tree">
                <ul>
                  ${renderTreeNode(memo.tree, true)}
                </ul>
              </div>
            </div>
          `;
        }
      } else if (currentView === 'EDITOR') {
        const node = findNodeById(currentMemoId, currentActiveNodeId);
        header.innerHTML = `
          <div style="display:flex; align-items:center;">
            <button class="back-btn" onclick="backToTree()">❮</button>
            <div class="nav-title">메모 수정</div>
          </div>
        `;

        content.innerHTML = `
          <div class="editor-container">
            <div class="editor-status" id="saveStatus">실시간 자동저장 중...</div>
            <input type="text" class="editor-title-input" id="nodeTitleEditor" value="${node ? escapeHtml(node.text) : ''}" placeholder="제목 입력" />
            <textarea class="editor-textarea" id="nodeContentEditor" placeholder="여기에 메모 내용을 입력하세요...">${node && node.content ? escapeHtml(node.content) : ''}</textarea>
          </div>
        `;

        // 실시간 제목 & 본문 자동저장
        setTimeout(() => {
          const titleInput = document.getElementById('nodeTitleEditor');
          const textarea = document.getElementById('nodeContentEditor');

          if (titleInput && textarea) {
            const handleInput = () => {
              if (node) {
                const newTitle = titleInput.value.trim() || '제목 없음';
                node.text = newTitle;
                node.content = textarea.value;

                // 최상위 루트 노드 제목 변경 시 메인 메모 이름도 변경
                const memo = appData.memos.find(m => m.id === currentMemoId);
                if (memo && memo.tree.id === node.id) {
                  memo.title = newTitle;
                }

                saveData();
                document.getElementById('saveStatus').innerText = '저장됨 ✓';
              }
            };

            titleInput.oninput = handleInput;
            textarea.oninput = handleInput;
          }
        }, 50);
      }
    }

    function renderTreeNode(node, isRoot = false) {
      const hasChildren = node.children && node.children.length > 0;
      const hasContent = node.content && node.content.trim().length > 0;

      let html = `<li>`;
      html += `
        <div class="node-box ${isRoot ? 'root-node' : ''}" onclick="openTextEditor('${node.id}')">
          <div>${escapeHtml(node.text)}</div>
          ${hasContent ? `<div class="node-has-content">📝 내용 있음</div>` : ''}
          <div class="node-controls" onclick="event.stopPropagation()">
            <button class="node-btn" onclick="openModal('addChild', '${node.id}')">+</button>
            ${!isRoot ? `<button class="node-btn del" onclick="deleteNode('${node.id}')">✕</button>` : ''}
          </div>
        </div>
      `;

      if (hasChildren) {
        html += `<ul>`;
        node.children.forEach(child => {
          html += renderTreeNode(child, false);
        });
        html += `</ul>`;
      }

      html += `</li>`;
      return html;
    }

    function openTextEditor(nodeId) {
      currentActiveNodeId = nodeId;
      currentView = 'EDITOR';
      render();
    }

    function backToTree() {
      currentView = 'MEMO';
      render();
    }

    function findNodeById(memoId, nodeId) {
      const memo = appData.memos.find(m => m.id === memoId);
      if (!memo) return null;

      function search(node) {
        if (node.id === nodeId) return node;
        if (node.children) {
          for (let child of node.children) {
            const found = search(child);
            if (found) return found;
          }
        }
        return null;
      }
      return search(memo.tree);
    }

    // Navigation Helpers
    function goHome() { currentView = 'HOME'; currentFolderId = null; render(); }
    function openFolder(fId) { currentView = 'FOLDER'; currentFolderId = fId; render(); }
    function openMemo(mId) { currentView = 'MEMO'; currentMemoId = mId; render(); }
    function backFromMemo() {
      if (currentFolderId) currentView = 'FOLDER';
      else currentView = 'HOME';
      render();
    }

    // Data Actions
    function deleteFolder(fId) {
      if (confirm('폴더와 내부에 포함된 모든 메모가 삭제됩니다.')) {
        appData.folders = appData.folders.filter(f => f.id !== fId);
        appData.memos = appData.memos.filter(m => m.folderId !== fId);
        saveData();
        render();
      }
    }

    function deleteMemo(mId) {
      if (confirm('메모를 삭제하시겠습니까?')) {
        appData.memos = appData.memos.filter(m => m.id !== mId);
        saveData();
        render();
      }
    }

    function deleteNode(nodeId) {
      const memo = appData.memos.find(m => m.id === currentMemoId);
      if (!memo) return;

      function removeRecursive(parent) {
        if (!parent.children) return;
        parent.children = parent.children.filter(c => c.id !== nodeId);
        parent.children.forEach(c => removeRecursive(c));
      }

      removeRecursive(memo.tree);
      saveData();
      render();
    }

    // Modal
    let modalCallback = null;
    function openModal(type, targetId = null) {
      const overlay = document.getElementById('modalOverlay');
      const title = document.getElementById('modalTitle');
      const input = document.getElementById('modalInput');
      const confirmBtn = document.getElementById('modalConfirmBtn');

      overlay.classList.add('active');
      input.value = '';
      input.focus();

      if (type === 'createFolder') {
        title.innerText = '새 폴더 생성';
        modalCallback = () => {
          const val = input.value.trim();
          if (val) {
            appData.folders.push({ id: 'f_' + Date.now(), name: val });
            saveData();
            render();
          }
        };
      } else if (type === 'createMemo') {
        title.innerText = '새 메모 생성 (제목)';
        modalCallback = () => {
          const val = input.value.trim();
          if (val) {
            const newMemo = {
              id: 'm_' + Date.now(),
              folderId: targetId,
              title: val,
              tree: { id: 'n_' + Date.now(), text: val, content: '', children: [] }
            };
            appData.memos.push(newMemo);
            saveData();
            openMemo(newMemo.id);
          }
        };
      } else if (type === 'addChild') {
        title.innerText = '하위 단계 노드 추가';
        modalCallback = () => {
          const val = input.value.trim();
          if (val) {
            const memo = appData.memos.find(m => m.id === currentMemoId);
            function addRecursive(node) {
              if (node.id === targetId) {
                if (!node.children) node.children = [];
                node.children.push({ id: 'n_' + Date.now(), text: val, content: '', children: [] });
                return true;
              }
              if (node.children) {
                for (let child of node.children) {
                  if (addRecursive(child)) return true;
                }
              }
              return false;
            }
            addRecursive(memo.tree);
            saveData();
            render();
          }
        };
      }

      confirmBtn.onclick = () => {
        if (modalCallback) modalCallback();
        closeModal();
      };
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function escapeHtml(str) {
      return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }

    // Init
    render();
  </script>
</body>
</html>
