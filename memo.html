<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메모 앱</title>
    <style>
        /* --- 기본 다크 모드 스타일 --- */
        :root {
            --bg-color: #000000;
            --card-bg: #1c1c1e;
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --accent-color: #ff3b30;
            --border-color: #2c2c2e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* --- 헤더 --- */
        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* --- 상단 폴더 영역 (텍스트 칩 형태) --- */
        .folder-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 28px;
        }

        .folder-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border-color);
        }

        .folder-card .count {
            color: var(--text-secondary);
            font-size: 12px;
            margin-bottom: 6px;
        }

        .folder-card .title {
            font-size: 15px;
            font-weight: 600;
        }

        /* --- 노트 리스트 영역 (텍스트 전용) --- */
        .note-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 80px;
        }

        .note-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .note-info {
            flex: 1;
            padding-right: 12px;
        }

        .note-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-date {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
        }

        /* --- 작성/입력 폼 --- */
        .form-container {
            background-color: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
        }

        input[type="text"], textarea, select {
            width: 100%;
            background-color: #2c2c2e;
            border: none;
            border-radius: 8px;
            color: var(--text-primary);
            padding: 12px;
            font-size: 14px;
            margin-bottom: 10px;
            outline: none;
        }

        textarea {
            height: 80px;
            resize: none;
        }

        .add-btn {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }

        .add-btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header>
        <h1>폴더</h1>
        <p id="stats-summary">폴더 0개, 노트 0개</p>
    </header>

    <!-- 메모 작성 폼 -->
    <div class="form-container">
        <select id="folder-select">
            <option value="알고리즘">알고리즘</option>
            <option value="인공지능">인공지능</option>
            <option value="정보통신개론">정보통신개론</option>
            <option value="자료구조">자료구조</option>
        </select>
        <input type="text" id="note-title-input" placeholder="제목을 입력하세요">
        <textarea id="note-content-input" placeholder="내용을 입력하세요"></textarea>
        <button class="add-btn" onclick="addNote()">메모 저장</button>
    </div>

    <!-- 폴더 요약 목록 (그림 없음) -->
    <div class="folder-grid" id="folder-grid"></div>

    <!-- 노트 목록 (썸네일 없음) -->
    <div class="note-list" id="note-list"></div>

    <script>
        // 초기 데이터 세팅 (로컬스토리지에 데이터가 없으면 기본값 사용)
        const defaultNotes = [
            { id: 1, folder: "알고리즘", title: "중학교. 나쁘거나 실없는, 불량스럽게 보...", date: "6월 29일" },
            { id: 2, folder: "인공지능", title: "수학은 포기해도 꿈은 포기하지말자.", date: "6월 29일" },
            { id: 3, folder: "정보통신개론", title: "데이트코스 스튜디오", date: "6월 29일" },
            { id: 4, folder: "자료구조", title: "전기기능사 취득: 국가 공인 자격증으로 ...", date: "6월 29일" }
        ];

        // LocalStorage에서 데이터 불러오기 (JSON 방식)
        function getNotes() {
            const saved = localStorage.getItem("my_offline_notes");
            return saved ? JSON.parse(saved) : defaultNotes;
        }

        // LocalStorage에 데이터 저장하기
        function saveNotes(notes) {
            localStorage.setItem("my_offline_notes", JSON.stringify(notes));
            render();
        }

        // 메모 추가 함수
        function addNote() {
            const folder = document.getElementById("folder-select").value;
            const titleInput = document.getElementById("note-title-input");
            const title = titleInput.value.trim();

            if (!title) {
                alert("제목을 입력해 주세요.");
                return;
            }

            const now = new Date();
            const dateStr = `${now.getMonth() + 1}월 ${now.getDate()}일`;

            const notes = getNotes();
            notes.unshift({
                id: Date.now(),
                folder: folder,
                title: title,
                date: dateStr
            });

            saveNotes(notes);
            titleInput.value = "";
            document.getElementById("note-content-input").value = "";
        }

        // 메모 삭제 함수
        function deleteNote(id) {
            const notes = getNotes().filter(note => note.id !== id);
            saveNotes(notes);
        }

        // 화면 렌더링 함수
        function render() {
            const notes = getNotes();

            // 1. 통계 업데이트
            const folders = ["알고리즘", "인공지능", "정보통신개론", "자료구조"];
            document.getElementById("stats-summary").innerText = 
                `폴더 ${folders.length}개, 노트 ${notes.length}개`;

            // 2. 폴더 카운트 계산 및 렌더링 (이미지 제거, 텍스트 형태)
            const folderGrid = document.getElementById("folder-grid");
            folderGrid.innerHTML = "";
            
            folders.forEach(folderName => {
                const count = notes.filter(n => n.folder === folderName).length;
                folderGrid.innerHTML += `
                    <div class="folder-card">
                        <div class="count">${count}</div>
                        <div class="title">${folderName}</div>
                    </div>
                `;
            });

            // 3. 노트 리스트 렌더링 (썸네일 없이 텍스트 중심)
            const noteList = document.getElementById("note-list");
            noteList.innerHTML = "";

            notes.forEach(note => {
                noteList.innerHTML += `
                    <div class="note-item">
                        <div class="note-info">
                            <div class="note-title">${note.title}</div>
                            <div class="note-date">${note.date}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteNote(${note.id})">&times;</button>
                    </div>
                `;
            });
        }

        // 페이지 최초 로드 시 실행
        render();
    </script>
</body>
</html>
