<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tree Structure Offline Memo</title>
  <style>
    :root {
      --bg: #000000;
      --card-bg: rgba(18, 18, 18, 0.85);
      --border: #2c2c2e;
      --text: #ffffff;
      --sub-text: #8e8e93;
      --accent: #ffffff;
      --line: #555555;
      --danger: #ff453a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(2px);
    }

    /* Header Nav */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 10px;
      background: rgba(0, 0, 0, 0.85);
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--border);
      gap: 8px;
    }

    .header-left {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 0;
    }

    .nav-title {
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      padding-right: 6px;
      flex-shrink: 0;
    }

    .action-btns {
      display: flex;
      gap: 3px;
      align-items: center;
      flex-shrink: 0;
    }

    .btn {
      background: var(--text);
      color: #000000;
      border: none;
      padding: 5px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.15);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .content-area {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Search Bar Area */
    .search-container {
      margin-bottom: 14px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px 10px 36px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .search-input::placeholder {
      color: var(--sub-text);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      color: var(--sub-text);
      pointer-events: none;
    }

    .search-results-title {
      font-size: 12px;
      color: var(--sub-text);
      margin-bottom: 8px;
      font-weight: 600;
    }

    .section-title {
      font-size: 13px;
      color: var(--sub-text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 16px 0 8px 4px;
    }

    /* List Card */
    .list-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .list-card:active {
      background: rgba(255, 255, 255, 0.1);
    }

    .card-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      overflow: hidden;
    }

    .card-icon {
      font-size: 18px;
    }

    .card-text {
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-sub {
      font-size: 12px;
      color: var(--sub-text);
      margin-top: 2px;
    }

    .card-actions {
      display: flex;
      gap: 2px;
      align-items: center;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--sub-text);
      padding: 4px 5px;
      font-size: 12px;
      cursor: pointer;
      border-radius: 6px;
    }

    /* Tree View */
    .tree-container {
      width: 100%;
      overflow-x: auto;
      padding: 20px 0;
    }

    .tree-wrapper {
      display: inline-block;
      min-width: 100%;
      padding: 0 40px;
      text-align: center;
    }

    .tree, .tree ul, .tree li {
      list-style: none;
      margin: 0;
      padding: 0;
      position: relative;
    }

    .tree {
      display: inline-flex;
      justify-content: center;
    }

    .tree ul { display: flex; padding-top: 20px; position: relative; }
    .tree ul::before { content: ''; position: absolute; top: 0; left: 50%; border-left: 2px solid var(--line); width: 0; height: 20px; }
    .tree li { float: left; text-align: center; position: relative; padding: 20px 8px 0 8px; }
    .tree li::before, .tree li::after { content: ''; position: absolute; top: 0; right: 50%; border-top: 2px solid var(--line); width: 50%; height: 20px; }
    .tree li::after { right: auto; left: 50%; border-left: 2px solid var(--line); }
    .tree li:only-child::after, .tree li:only-child::before { display: none; }
    .tree li:only-child { padding-top: 0; }
    .tree li:first-child::before, .tree li:last-child::after { border: none; }
    .tree li:last-child::before { border-right: 2px solid var(--line); border-radius: 0 5px 0 0; }
    .tree li:first-child::after { border-radius: 5px 0 0 0; }

    .node-box {
      border: 1px solid var(--accent);
      background: var(--card-bg);
      color: var(--text);
      padding: 10px 12px;
      display: inline-block;
      border-radius: 10px;
      min-width: 95px;
      max-width: 140px;
      word-break: break-word;
      font-size: 13px;
      cursor: pointer;
    }

    .node-box.root-node {
      border: 2px solid var(--text);
      font-weight: bold;
      font-size: 15px;
      background: rgba(40, 40, 40, 0.9);
    }

    .node-controls {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 6px;
    }

    .node-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      border-radius: 50%;
      width: 20px; height: 20px;
      font-size: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* Editor View */
    .editor-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .editor-status {
      font-size: 12px;
      color: var(--sub-text);
    }

    .editor-title-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      font-size: 20px;
      font-weight: bold;
      padding: 8px 0;
      outline: none;
    }

    .editor-textarea {
      width: 100%;
      min-height: 120px;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 16px;
      line-height: 1.6;
      resize: none;
    }

    .choice-container {
      margin-top: 10px;
      padding-top: 16px;
      border-top: 1px dashed var(--border);
    }

    .choice-title {
      font-size: 12px;
      color: var(--sub-text);
      margin-bottom: 10px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .choice-buttons {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .choice-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.15s;
    }

    .choice-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .add-choice-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px dashed var(--border);
      color: var(--sub-text);
      padding: 10px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
    }

    /* Settings View */
    .settings-group {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .settings-input {
      width: 100%;
      padding: 10px 12px;
      background: #000;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .settings-btn {
      width: 100%;
      padding: 12px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      gap: 8px;
    }

    /* Map View Style */
    .map-container { padding: 8px 0; }
    .map-tree, .map-tree ul, .map-tree li { list-style: none; margin: 0; padding: 0; }
    .map-tree ul { margin-left: 18px; border-left: 1px dashed var(--line); padding-left: 10px; }
    .map-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; margin: 4px 0;
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 8px; font-size: 13px; cursor: pointer;
    }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; pointer-events: none;
      transition: opacity 0.2s; z-index: 100;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal {
      background: #1c1c1e; border: 1px solid var(--border);
      border-radius: 16px; padding: 20px; width: 100%; max-width: 360px;
      max-height: 80vh; display: flex; flex-direction: column;
    }
    .modal h3 { font-size: 16px; margin-bottom: 12px; }
    .modal input {
      width: 100%; padding: 10px; background: #000;
      border: 1px solid var(--border); border-radius: 8px;
      color: #fff; margin-bottom: 16px; outline: none;
    }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; }

    /* 스토리 모드 모달 스타일 */
    .story-container {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 16px;
      padding-right: 4px;
    }
    .story-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--border);
      padding-bottom: 10px;
      margin-bottom: 4px;
      gap: 10px;
    }
    .story-main-title {
      font-size: 18px;
      font-weight: 800;
      color: #ffffff;
      word-break: break-all;
    }
    .story-body {
      font-size: 15px;
      color: #e5e5ea;
      white-space: pre-wrap;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header id="header"></header>
    <div class="content-area" id="content"></div>
  </div>

  <input type="file" id="jsonFileInput" style="display: none;" onchange="importJSON(event)" />
  <input type="file" id="bgFileInput" accept="image/*" style="display: none;" onchange="uploadBgImage(event)" />

  <!-- Global Input Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h3 id="modalTitle">입력</h3>
      <input type="text" id="modalInput" autofocus />
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeModal()">취소</button>
        <button class="btn" id="modalConfirmBtn">확인</button>
      </div>
    </div>
  </div>

  <!-- Story View Modal (전체 보기) -->
  <div class="modal-overlay" id="historyModalOverlay">
    <div class="modal">
      <h3>📖 전체 보기</h3>
      <div class="story-container" id="historyListContent"></div>
      <div class="modal-btns">
        <button class="btn btn-secondary" onclick="closeHistoryModal()">닫기</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'TREE_MEMO_APP_DATA_V7';

    let appData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {
      appTitle: '내 메모',
      bgImage: '',
      folders: [
        { id: 'f1', parentId: null, name: '📌 업무 프로젝트' }
      ],
      memos: [
        {
          id: 'm1',
          folderId: 'f1',
          title: '신규 시스템 구조도',
          tree: {
            id: 'n1',
            text: '신규 시스템 개요',
            content: '이 프로젝트는 차세대 가상 시스템의 핵심 설계를 다룹니다.',
            children: [
              {
                id: 'n2',
                text: '프론트엔드 모듈',
                content: '사용자 인터페이스는 반응형 모바일 우선 환경으로 구축되었습니다.',
                children: []
              }
            ]
          }
        }
      ]
    };

    if (!appData.appTitle) appData.appTitle = '내 메모';

    let currentView = 'HOME';
    let currentFolderId = null;
    let currentMemoId = null;
    let currentActiveNodeId = null;
    let searchQuery = '';

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
      applyBgImage();
    }

    function applyBgImage() {
      if (appData.bgImage) {
        document.body.style.backgroundImage = `url('${appData.bgImage}')`;
      } else {
        document.body.style.backgroundImage = 'none';
      }
    }

    function renderHeaderNav(titleHtml, parentFolderId = null, isHome = false) {
      return `
        <div class="header-left">
          ${parentFolderId !== undefined && !isHome ? `<button class="back-btn" onclick="backFromFolder()">❮</button>` : ''}
          <div class="nav-title">${titleHtml}</div>
        </div>
        <div class="action-btns">
          ${isHome ? `<button class="btn btn-secondary" onclick="openRandomItem()">🎲 랜덤</button>` : ''}
          <button class="btn btn-secondary" onclick="openSettings()">설정</button>
          <button class="btn btn-secondary" onclick="openMap()">지도</button>
          <button class="btn btn-secondary" onclick="openModal('createFolder', ${parentFolderId ? `'${parentFolderId}'` : 'null'})">+ 폴더</button>
          <button class="btn" onclick="openModal('createMemo', ${parentFolderId ? `'${parentFolderId}'` : 'null'})">+ 메모</button>
        </div>
      `;
    }

    function getAllNodesFromMemo(memo) {
      let nodes = [];
      function collect(node) {
        nodes.push({ memoId: memo.id, node: node });
        if (node.children) {
          node.children.forEach(c => collect(c));
        }
      }
      if (memo && memo.tree) collect(memo.tree);
      return nodes;
    }

    function openRandomItem() {
      let allNodes = [];
      appData.memos.forEach(m => {
        allNodes = allNodes.concat(getAllNodesFromMemo(m));
      });

      if (allNodes.length === 0) {
        alert('등록된 메모가 없습니다.');
        return;
      }

      const randomIndex = Math.floor(Math.random() * allNodes.length);
      const picked = allNodes[randomIndex];

      currentMemoId = picked.memoId;
      openTextEditor(picked.node.id);
    }

    /* 현재 노드의 루트까지 연결된 전체 경로 가져오기 */
    function getNodePath(nodeId) {
      const memo = appData.memos.find(m => m.id === currentMemoId);
      if (!memo) return [];

      let path = [];
      function findPath(current, targetId) {
        path.push(current);
        if (current.id === targetId) return true;
        if (current.children) {
          for (let child of current.children) {
            if (findPath(child, targetId)) return true;
          }
        }
        path.pop();
        return false;
      }

      findPath(memo.tree, nodeId);
      return path;
    }

    /* 클립보드 복사 함수 */
    function copyStoryToClipboard(title, bodyText) {
      const fullText = `${title}\n\n${bodyText}`;
      navigator.clipboard.writeText(fullText).then(() => {
        alert('📋 전체 내용이 클립보드에 복사되었습니다!');
      }).catch(() => {
        // Fallback
        const textarea = document.createElement('textarea');
        textarea.value = fullText;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        alert('📋 전체 내용이 클립보드에 복사되었습니다!');
      });
    }

    /* 최상위 제목 하나만 크게 두고, 이하 내용만 하나의 연속된 글로 출력 (복사 버튼 추가) */
    function openHistoryModal() {
      const pathNodes = getNodePath(currentActiveNodeId);
      const container = document.getElementById('historyListContent');

      if (pathNodes.length === 0) {
        container.innerHTML = '<div style="color:var(--sub-text); font-size:13px;">내용이 없습니다.</div>';
      } else {
        const rootTitle = pathNodes[0].text;

        let textSegments = [];
        pathNodes.forEach(n => {
          if (n.content && n.content.trim().length > 0) {
            textSegments.push(n.content.trim());
          }
        });

        const fullBodyText = textSegments.join("\n\n");
        const safeTitle = escapeHtml(rootTitle);
        const safeBody = fullBodyText ? escapeHtml(fullBodyText) : '';

        container.innerHTML = `
          <div class="story-header-row">
            <div class="story-main-title">${safeTitle}</div>
            <button class="btn" style="flex-shrink:0;" onclick="copyStoryToClipboard(\`${escapeQuote(rootTitle)}\`, \`${escapeQuote(fullBodyText)}\`)">📋 복사</button>
          </div>
          <div class="story-body">${safeBody || '<span style="color:var(--sub-text); font-size:13px;">작성된 내용이 없습니다.</span>'}</div>
        `;
      }

      document.getElementById('historyModalOverlay').classList.add('active');
    }

    function escapeQuote(str) {
      return str ? str.replace(/`/g, "\\`").replace(/\$/g, "\\$") : '';
    }

    function closeHistoryModal() {
      document.getElementById('historyModalOverlay').classList.remove('active');
    }

    function render() {
      applyBgImage();
      const header = document.getElementById('header');
      const content = document.getElementById('content');

      if (currentView === 'HOME') {
        header.innerHTML = renderHeaderNav(escapeHtml(appData.appTitle), null, true);

        let html = `
          <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" id="searchInput" value="${escapeHtml(searchQuery)}" placeholder="폴더, 메모, 내용 검색..." oninput="handleSearch(this.value)" />
          </div>
        `;

        if (searchQuery.trim().length > 0) {
          /* 검색 결과 표시 모드 */
          const q = searchQuery.trim().toLowerCase();
          
          // 1. 폴더 검색
          const matchedFolders = appData.folders.filter(f => f.name.toLowerCase().includes(q));
          
          // 2. 메모 및 메모 내부 노드 검색
          let matchedMemos = [];
          appData.memos.forEach(m => {
            const nodes = getAllNodesFromMemo(m);
            const titleMatch = m.title.toLowerCase().includes(q);
            const nodeMatch = nodes.some(n => 
              (n.node.text && n.node.text.toLowerCase().includes(q)) || 
              (n.node.content && n.node.content.toLowerCase().includes(q))
            );

            if (titleMatch || nodeMatch) {
              matchedMemos.push({ memo: m, nodeMatch: nodeMatch && !titleMatch });
            }
          });

          html += `<div class="search-results-title">🔍 검색 결과 (${matchedFolders.length + matchedMemos.length}개)</div>`;

          if (matchedFolders.length === 0 && matchedMemos.length === 0) {
            html += `<div style="color:var(--sub-text); font-size:13px; text-align:center; margin-top:30px;">검색 결과가 없습니다.</div>`;
          } else {
            matchedFolders.forEach(f => {
              html += `
                <div class="list-card" onclick="openFolder('${f.id}')">
                  <div class="card-info">
                    <span class="card-icon">📁</span>
                    <div>
                      <div class="card-text">${escapeHtml(f.name)}</div>
                      <div class="card-sub">폴더</div>
                    </div>
                  </div>
                </div>
              `;
            });

            matchedMemos.forEach(item => {
              const m = item.memo;
              html += `
                <div class="list-card" onclick="openMemo('${m.id}')">
                  <div class="card-info">
                    <span class="card-icon">📄</span>
                    <div>
                      <div class="card-text">${escapeHtml(m.title)}</div>
                      <div class="card-sub">${item.nodeMatch ? '내부 내용 일치' : '메모'}</div>
                    </div>
                  </div>
                </div>
              `;
            });
          }

        } else {
          /* 일반 홈 화면 모드 */
          const rootFolders = appData.folders.filter(f => !f.parentId);
          const rootMemos = appData.memos.filter(m => !m.folderId);

    function renderMapStructure(parentId) {
      const folders = appData.folders.filter(f => f.parentId === parentId);
      const memos = appData.memos.filter(m => m.folderId === parentId);

      if (folders.length === 0 && memos.length === 0) return '';

      let html = '<ul>';

      folders.forEach(f => {
        html += `
          <li>
            <div class="map-item folder" onclick="openFolder('${f.id}')">
              📁 <span>${escapeHtml(f.name)}</span>
            </div>
            ${renderMapStructure(f.id)}
          </li>
        `;
      });

      memos.forEach(m => {
        html += `
          <li>
            <div class="map-item memo" onclick="openMemo('${m.id}')">
              📄 <span>${escapeHtml(m.title)}</span>
            </div>
            ${renderMapNodeTree(m.tree, m.id)}
          </li>
        `;
      });

      html += '</ul>';
      return html;
    }

    function renderMapNodeTree(node, memoId) {
      if (!node) return '';
      let html = '<ul>';
      html += `
        <li>
          <div class="map-item node" onclick="currentMemoId='${memoId}'; openTextEditor('${node.id}')">
            └ <span>${escapeHtml(node.text)}</span>
          </div>
          ${node.children ? node.children.map(c => renderMapNodeTree(c, memoId)).join('') : ''}
        </li>
      `;
      html += '</ul>';
      return html;
    }

    function renderTreeNode(node, isRoot = false) {
      const hasChildren = node.children && node.children.length > 0;
      const hasContent = node.content && node.content.trim().length > 0;

      let html = `<li>`;
      html += `
        <div class="node-box ${isRoot ? 'root-node' : ''}" onclick="openTextEditor('${node.id}')">
          <div>${escapeHtml(node.text)}</div>
          ${hasContent ? `<div style="font-size:10px; color:var(--sub-text); margin-top:4px;">📝 내용 있음</div>` : ''}
          <div class="node-controls" onclick="event.stopPropagation()">
            <button class="node-btn" onclick="openModal('addChild', '${node.id}')">+</button>
            ${!isRoot ? `<button class="node-btn" style="color:var(--danger)" onclick="deleteNode('${node.id}')">✕</button>` : ''}
          </div>
        </div>
      `;

      if (hasChildren) {
        html += `<ul>`;
        node.children.forEach(child => {
          html += renderTreeNode(child, false);
        });
        html += `</ul>`;
      }

      html += `</li>`;
      return html;
    }

    function triggerBgFileInput() { document.getElementById('bgFileInput').click(); }
    function uploadBgImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        appData.bgImage = e.target.result;
        saveData();
        render();
      };
      reader.readAsDataURL(file);

    function updateAppTitle() {
      const input = document.getElementById('appTitleInput');
      if (input) {
        const val = input.value.trim();

        saveData();

    function clearAllData() {
      if (confirm('정말로 모든 폴더, 메모 및 설정을 삭제하시겠습니까?')) {
        localStorage.removeItem(STORAGE_KEY);
        appData = { appTitle: '내 메모', bgImage: '', folders: [], memos: [] };
        saveData();
        alert('모든 데이터가 초기화되었습니다.');
        goHome();
      }
    }

    function moveFolder(parentId, index, direction) {
      const filteredFolders = appData.folders.filter(f => f.parentId === parentId);
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= filteredFolders.length) return;

      const idx1 = appData.folders.findIndex(f => f.id === filteredFolders[index].id);
      const idx2 = appData.folders.findIndex(f => f.id === filteredFolders[targetIndex].id);

      const temp = appData.folders[idx1];
      appData.folders[idx1] = appData.folders[idx2];
      appData.folders[idx2] = temp;

      saveData();
      render();
    }

    function moveMemo(folderId, index, direction) {
      const filteredMemos = appData.memos.filter(m => m.folderId === folderId);
      const targetIndex = index + direction;
      if (targetIndex < 0 || targetIndex >= filteredMemos.length) return;

      const idx1 = appData.memos.findIndex(m => m.id === filteredMemos[index].id);
      const idx2 = appData.memos.findIndex(m => m.id === filteredMemos[targetIndex].id);

      const temp = appData.memos[idx1];
      appData.memos[idx1] = appData.memos[idx2];
      appData.memos[idx2] = temp;

      saveData();
      render();
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
      const downloadAnchor = document.createElement('a');
      const safeTitle = (appData.appTitle || '내 메모').replace(/[\\/:*?"<>|]/g, '_');
      const dateStr = new Date().toISOString().slice(0,10);
      
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `${safeTitle}_${dateStr}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerFileInput() {
      const fileInput = document.getElementById('jsonFileInput');
      fileInput.value = '';
      fileInput.click();
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);
          if (importedData && importedData.folders && importedData.memos) {
            appData = importedData;
            if (!appData.appTitle) appData.appTitle = '내 메모';
            saveData();
            alert('데이터를 성공적으로 불러왔습니다!');
            goHome();
          } else {
            alert('올바른 백업 파일 형식이 아닙니다.');
          }
        } catch (err) {
          alert('파일을 읽는 중 오류가 발생했습니다.');
        }
      };
      reader.readAsText(file);
    }

      else currentView = 'HOME';

      currentActiveNodeId = nodeId;
      currentView = 'EDITOR';
      render();

    function backToTree() {
      currentView = 'MEMO';
      render();
    }

    function findNodeById(memoId, nodeId) {
      const memo = appData.memos.find(m => m.id === memoId);
      if (!memo) return null;

      function search(node) {
        if (node.id === nodeId) return node;
        if (node.children) {
          for (let child of node.children) {
            const found = search(child);
            if (found) return found;
          }
        }
        return null;
      }
      return search(memo.tree);
    }

    function deleteFolder(fId) {
      if (confirm('폴더와 내부 모든 항목이 삭제됩니다.')) {
        function collectFolderIds(targetId) {
          let ids = [targetId];
          const subs = appData.folders.filter(f => f.parentId === targetId);
          subs.forEach(s => { ids = ids.concat(collectFolderIds(s.id)); });
          return ids;
        }

        const deleteTargetIds = collectFolderIds(fId);
        appData.folders = appData.folders.filter(f => !deleteTargetIds.includes(f.id));
        appData.memos = appData.memos.filter(m => !deleteTargetIds.includes(m.folderId));

        saveData();
        render();
      }
    }

    function deleteMemo(mId) {
      if (confirm('메모를 삭제하시겠습니까?')) {
        appData.memos = appData.memos.filter(m => m.id !== mId);
        saveData();
        render();
      }
    }

    function deleteNode(nodeId) {
      const memo = appData.memos.find(m => m.id === currentMemoId);
      if (!memo) return;

      function removeRecursive(parent) {
        if (!parent.children) return;
        parent.children = parent.children.filter(c => c.id !== nodeId);
        parent.children.forEach(c => removeRecursive(c));
      }

      removeRecursive(memo.tree);
      saveData();
      render();
    }

    let modalCallback = null;
    function openModal(type, targetId = null) {
      const overlay = document.getElementById('modalOverlay');
      const title = document.getElementById('modalTitle');
      const input = document.getElementById('modalInput');
      const confirmBtn = document.getElementById('modalConfirmBtn');

      overlay.classList.add('active');
      input.value = '';
      input.focus();

      if (type === 'createFolder') {
        title.innerText = '새 폴더 생성';
        modalCallback = () => {
          const val = input.value.trim();
          if (val) {
            appData.folders.push({ id: 'f_' + Date.now(), parentId: targetId, name: val });
            saveData();
            render();
          }
        };
      } else if (type === 'renameFolder') {
        title.innerText = '폴더 이름 변경';
        const folder = appData.folders.find(f => f.id === targetId);
        if (folder) input.value = folder.name;

        modalCallback = () => {
          const val = input.value.trim();
          if (val && folder) {
            folder.name = val;
            saveData();
            render();
          }
        };
      } else if (type === 'renameMemo') {
        title.innerText = '메모 이름 변경';
        const memo = appData.memos.find(m => m.id === targetId);
        if (memo) input.value = memo.title;

        modalCallback = () => {
          const val = input.value.trim();
          if (val && memo) {
            memo.title = val;
            if (memo.tree) memo.tree.text = val;
            saveData();
            render();
          }
        };
      } else if (type === 'createMemo') {
        title.innerText = '새 메모 생성 (제목)';
        modalCallback = () => {
          const val = input.value.trim();
          if (val) {
            const newMemo = {
              id: 'm_' + Date.now(),
              folderId: targetId,
              title: val,
              tree: { id: 'n_' + Date.now(), text: val, content: '', children: [] }
            };
            appData.memos.push(newMemo);
            saveData();
            currentMemoId = newMemo.id;
            openTextEditor(newMemo.tree.id);
          }
        };
      } else if (type === 'addChild') {
        title.innerText = '이어질 하위 갈림길 추가';
        modalCallback = () => {
          const val = input.value.trim();
          if (val) {
            const memo = appData.memos.find(m => m.id === currentMemoId);
            function addRecursive(node) {
              if (node.id === targetId) {
                if (!node.children) node.children = [];
                node.children.push({ id: 'n_' + Date.now(), text: val, content: '', children: [] });
                return true;
              }
              if (node.children) {
                for (let child of node.children) {
                  if (addRecursive(child)) return true;
                }
              }
              return false;
            }
            addRecursive(memo.tree);
            saveData();
            render();
          }
        };
      }

      confirmBtn.onclick = () => {
        if (modalCallback) modalCallback();
        closeModal();
      };
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function escapeHtml(str) {
      return str ? str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
    }

    render();
  </script>
</body>
</html>
