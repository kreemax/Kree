<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Story Notes</title>
  <style>
    :root {
      --bg-primary: #f8f9fa;
      --bg-card: #ffffff;
      --text-main: #212529;
      --text-sub: #868e96;
      --accent: #4c6ef5;
      --accent-hover: #3b5bdb;
      --border: #e9ecef;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      --radius: 16px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #121214;
        --bg-card: #1e1e24;
        --text-main: #f1f3f5;
        --text-sub: #909296;
        --accent: #5c7cfa;
        --border: #2c2e33;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header */
    header {
      padding: 16px 20px;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 { font-size: 1.25rem; font-weight: 700; }
    .header-btns button {
      background: none; border: none; font-size: 0.9rem; color: var(--accent); cursor: pointer; font-weight: 600; margin-left: 12px;
    }

    /* Main Area */
    main { flex: 1; display: flex; overflow: hidden; }

    /* Sidebar (Folder list) */
    aside {
      width: 240px;
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .folder-item {
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      color: var(--text-sub);
    }
    .folder-item.active { background: var(--accent); color: #fff; font-weight: 600; }
    .add-folder-btn {
      margin-top: auto;
      padding: 10px;
      border: 1px dashed var(--border);
      border-radius: 10px;
      background: none;
      color: var(--text-sub);
      cursor: pointer;
    }

    /* Note Content View */
    section.editor {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .meta-bar {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    select, input[type="text"] {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
    }
    input.title-input { font-size: 1.4rem; font-weight: 700; border: none; background: transparent; width: 100%; outline: none; }

    textarea.content-input {
      width: 100%;
      height: 250px;
      padding: 14px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 1rem;
      line-height: 1.6;
      resize: vertical;
      white-space: pre-wrap; /* 줄바꿈 완벽 유지 */
      outline: none;
    }

    /* Branches (선택지 시스템) */
    .branch-section {
      background: var(--bg-card);
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
    }
    .branch-section h3 { font-size: 1rem; margin-bottom: 12px; color: var(--text-sub); }
    .branch-list { display: flex; flex-direction: column; gap: 8px; }
    .branch-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      text-align: left;
    }
    .branch-btn:hover { border-color: var(--accent); }
    
    .add-branch-box {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .add-branch-box input { flex: 1; }
    .btn-primary {
      background: var(--accent);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Toggle Pin Button */
    .pin-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; }

    /* Mobile Responsive */
    @media (max-width: 600px) {
      aside { width: 100px; padding: 10px; }
      .folder-item { font-size: 0.8rem; padding: 8px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Story Notes</h1>
    <div class="header-btns">
      <button onclick="createNewNote()">+ 새 메모</button>
      <button onclick="exportJSON()">백업(JSON)</button>
      <button onclick="document.getElementById('importFile').click()">불러오기</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
    </div>
  </header>

  <main>
    <!-- 폴더 시스템 -->
    <aside id="folderList">
      <!-- JS로 동적 생성 -->
    </aside>

    <!-- 메모 작성 & 분기 시스템 -->
    <section class="editor" id="editorView">
      <div class="meta-bar">
        <button class="pin-btn" id="pinBtn" onclick="togglePin()">☆</button>
        <select id="folderSelect" onchange="updateNoteFolder()"></select>
      </div>

      <input type="text" id="noteTitle" class="title-input" placeholder="제목을 입력하세요..." oninput="saveCurrentNote()">
      
      <textarea id="noteContent" class="content-input" placeholder="상황과 내용을 작성하세요... (줄바꿈 완벽 지원)" oninput="saveCurrentNote()"></textarea>

      <!-- 선택지 분기 섹션 -->
      <div class="branch-section">
        <h3>갈림길 선택지 (다음 행동/상황)</h3>
        <div class="branch-list" id="branchList">
          <!-- 분기 버튼 목록 -->
        </div>

        <div class="add-branch-box">
          <input type="text" id="newChoiceText" placeholder="예: A) 동굴 안으로 들어간다">
          <button class="btn-primary" onclick="addBranchChoice()">선택지 추가</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    // 앱 초기 상태
    let appData = {
      folders: ["기본 폴더", "메인 스토리", "외전"],
      currentFolder: "기본 폴더",
      currentNoteId: null,
      notes: []
    };

    // 앱 초기화
    window.onload = () => {
      loadLocalStorage();
      if (appData.notes.length === 0) {
        createNewNote("시작 페이지", "어두운 숲 속 갈림길에 서 있습니다.\n어디로 이동하시겠습니까?");
      } else {
        appData.currentNoteId = appData.notes[0].id;
      }
      render();
    };

    // 1. 선택지 추가 기능 (분기 시스템의 핵심)
    function addBranchChoice() {
      const input = document.getElementById("newChoiceText");
      const choiceText = input.value.trim();
      if (!choiceText) return;

      const currentNote = getCurrentNote();
      
      // 선택지를 눌렀을 때 연결될 '새 메모' 생성
      const targetNote = {
        id: Date.now().toString(),
        title: choiceText,
        content: `[${choiceText}] 선택 후 이어지는 이야기...`,
        folder: currentNote.folder,
        isPinned: false, // 마이그레이션 기본값
        branches: []
      };

      appData.notes.push(targetNote);

      // 현재 메모에 선택지 연동
      if (!currentNote.branches) currentNote.branches = [];
      currentNote.branches.push({
        label: choiceText,
        targetId: targetNote.id
      });

      input.value = "";
      saveLocalStorage();
      render();
    }

    // 선택지 클릭시 연결된 메모로 이동
    function navigateToNote(targetId) {
      appData.currentNoteId = targetId;
      render();
    }

    // 2. 백업 (JSON 다운로드)
    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `story_notes_backup_${new Date().toISOString().slice(0,10)}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    // 3. 불러오기 (JSON 복원 및 데이터 마이그레이션)
    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedData = JSON.parse(e.target.result);

          // 데이터 안전성 확보 (마이그레이션)
          if (Array.isArray(importedData.notes)) {
            importedData.notes = importedData.notes.map(note => ({
              id: note.id || Date.now().toString(),
              title: note.title || "제목 없음",
              content: note.content || "",
              folder: note.folder || "기본 폴더",
              // 새로 추가된 규격 기본값(Nullish Coalescing)
              isPinned: note.isPinned ?? false,
              branches: note.branches ?? []
            }));
          }

          appData = {
            folders: importedData.folders || ["기본 폴더"],
            currentFolder: importedData.currentFolder || "기본 폴더",
            notes: importedData.notes || [],
            currentNoteId: importedData.notes?.[0]?.id || null
          };

          saveLocalStorage();
          render();
          alert("성공적으로 복원되었습니다!");
        } catch (err) {
          alert("올바르지 않은 JSON 파일입니다.");
        }
      };
      reader.readAsText(file);
    }

    // Helper functions
    function getCurrentNote() {
      return appData.notes.find(n => n.id === appData.currentNoteId) || appData.notes[0];
    }

    function createNewNote(title = "새 메모", content = "") {
      const newNote = {
        id: Date.now().toString(),
        title: title,
        content: content,
        folder: appData.currentFolder,
        isPinned: false,
        branches: []
      };
      appData.notes.unshift(newNote);
      appData.currentNoteId = newNote.id;
      saveLocalStorage();
      render();
    }

    function togglePin() {
      const note = getCurrentNote();
      note.isPinned = !note.isPinned;
      saveLocalStorage();
      render();
    }

    function saveCurrentNote() {
      const note = getCurrentNote();
      if (!note) return;
      note.title = document.getElementById("noteTitle").value;
      note.content = document.getElementById("noteContent").value;
      saveLocalStorage();
    }

    function updateNoteFolder() {
      const note = getCurrentNote();
      note.folder = document.getElementById("folderSelect").value;
      saveLocalStorage();
      render();
    }

    function saveLocalStorage() {
      localStorage.setItem("STORY_NOTES_DATA", JSON.stringify(appData));
    }

    function loadLocalStorage() {
      const local = localStorage.getItem("STORY_NOTES_DATA");
      if (local) {
        try { appData = JSON.parse(local); } catch(e) {}
      }
    }

    // 렌더링 함수
    function render() {
      // 1. 폴더 바 렌더링
      const folderListEl = document.getElementById("folderList");
      folderListEl.innerHTML = appData.folders.map(f => `
        <div class="folder-item ${f === appData.currentFolder ? 'active' : ''}" onclick="selectFolder('${f}')">
          📁 ${f}
        </div>
      `).join('') + `<button class="add-folder-btn" onclick="addFolder()">+ 폴더 추가</button>`;

      // 2. 에디터 영역 렌더링
      const note = getCurrentNote();
      if (!note) return;

      document.getElementById("pinBtn").innerText = note.isPinned ? "★" : "☆";
      document.getElementById("noteTitle").value = note.title;
      document.getElementById("noteContent").value = note.content;

      // 폴더 셀렉트 옵션
      const folderSelect = document.getElementById("folderSelect");
      folderSelect.innerHTML = appData.folders.map(f => `
        <option value="${f}" ${f === note.folder ? 'selected' : ''}>${f}</option>
      `).join('');

      // 선택지 버튼 렌더링
      const branchList = document.getElementById("branchList");
      const branches = note.branches || [];
      
      branchList.innerHTML = branches.map(b => `
        <button class="branch-btn" onclick="navigateToNote('${b.targetId}')">
          <span>➔ ${b.label}</span>
          <small style="opacity:0.6">이동하기</small>
        </button>
      `).join('');
    }

    function selectFolder(folderName) {
      appData.currentFolder = folderName;
      render();
    }

    function addFolder() {
      const name = prompt("새 폴더 이름:");
      if (name && !appData.folders.includes(name)) {
        appData.folders.push(name);
        saveLocalStorage();
        render();
      }
    }
  </script>
</body>
</html>
