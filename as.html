<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>숫자 패턴 색상 생성기</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      margin: 20px;
      color: #333;
    }
    .controls {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 15px;
    }
    .form-group label {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .form-group input[type="number"] {
      width: 80px;
      padding: 4px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 15px;
    }
    .color-item {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f1f3f5;
      padding: 6px 10px;
      border-radius: 6px;
    }
    button {
      background: #228be6;
      color: white;
      border: none;
      padding: 10px 20px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }
    button:hover {
      background: #1c7ed6;
    }
    .canvas-container {
      overflow: auto;
      background: #e9ecef;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <h2>숫자 패턴 색상 생성기</h2>

  <div class="controls">
    <div class="form-group">
      <label><b>총 숫자 개수:</b>
        <input type="number" id="totalCount" value="1000" min="1" max="100000">
      </label>
      
      <label><b>가로 줄당 개수:</b>
        <input type="number" id="perRow" value="100" min="1" max="1000">
      </label>

      <!-- 블록 크기 입력 폼 추가 -->
      <label><b>블록 가로 (px):</b>
        <input type="number" id="cellWidth" value="30" min="5" max="500">
      </label>

      <label><b>블록 세로 (px):</b>
        <input type="number" id="cellHeight" value="20" min="5" max="500">
      </label>
    </div>

    <h4>숫자 포함 규칙별 색상 설정 (기본값: 흰색)</h4>
    <div class="color-grid" id="colorPickerContainer">
      <!-- 1부터 9까지 색상 피커 (기본값 #ffffff) -->
    </div>

    <button onclick="renderGrid()">캔버스 생성하기</button>
  </div>

  <div class="canvas-container">
    <canvas id="numCanvas"></canvas>
  </div>

  <script>
    // UI에 색상 피커 1~9 생성 (기본값 전부 흰색)
    const container = document.getElementById('colorPickerContainer');
    for (let i = 1; i <= 9; i++) {
      const item = document.createElement('div');
      item.className = 'color-item';
      item.innerHTML = `
        <input type="checkbox" id="enable_${i}" checked>
        <label for="enable_${i}"><b>'${i}' 포함:</b></label>
        <input type="color" id="color_${i}" value="#ffffff">
      `;
      container.appendChild(item);
    }

    function renderGrid() {
      const total = parseInt(document.getElementById('totalCount').value, 10);
      const perRow = parseInt(document.getElementById('perRow').value, 10);
      const cellWidth = parseInt(document.getElementById('cellWidth').value, 10);
      const cellHeight = parseInt(document.getElementById('cellHeight').value, 10);

      // 사용자가 지정한 색상 규칙 수집
      const rules = [];
      for (let i = 1; i <= 9; i++) {
        const enabled = document.getElementById(`enable_${i}`).checked;
        const color = document.getElementById(`color_${i}`).value;
        if (enabled) {
          rules.push({ digit: String(i), color: color });
        }
      }

      const rows = Math.ceil(total / perRow);

      const canvas = document.getElementById('numCanvas');
      const ctx = canvas.getContext('2d');

      canvas.width = perRow * cellWidth;
      canvas.height = rows * cellHeight;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // 블록 높이에 맞춰 폰트 크기 자동 조절
      const fontSize = Math.max(8, Math.floor(cellHeight * 0.55));
      ctx.font = `${fontSize}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let i = 1; i <= total; i++) {
        const strNum = String(i);
        const col = (i - 1) % perRow;
        const row = Math.floor((i - 1) / perRow);

        const x = col * cellWidth;
        const y = row * cellHeight;

        // 규칙 매칭 검사 (1~9 순서대로 우선 적용)
        let matchedColor = '#ffffff'; // 기본 배경색: 흰색

        for (const rule of rules) {
          if (strNum.includes(rule.digit)) {
            matchedColor = rule.color;
            break;
          }
        }

        // 배경 셀 그리기
        ctx.fillStyle = matchedColor;
        ctx.fillRect(x, y, cellWidth, cellHeight);

        // 테두리 선 그리기
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, cellWidth, cellHeight);

        // 숫자 텍스트 그리기 (글자색 검은색)
        ctx.fillStyle = '#000000';
        ctx.fillText(strNum, x + cellWidth / 2, y + cellHeight / 2);
      }
    }

    // 처음 로드시 자동 렌더링
    window.onload = renderGrid;
  </script>
</body>
</html>
