<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>클립보드 코드 새창 실행기</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f8;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      gap: 20px;
    }
    h1 {
      font-size: 1.5rem;
      color: #111;
      margin-bottom: 5px;
    }
    p {
      color: #6b7280;
      font-size: 0.95rem;
    }
    .btn-run {
      background-color: #2563eb;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2);
      transition: background 0.2s, transform 0.1s;
    }
    .btn-run:hover {
      background-color: #1d4ed8;
    }
    .btn-run:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <div>
    <h1>🚀 클립보드 코드 새창 실행기</h1>
    <p>클립보드에 코드를 복사한 뒤 버튼을 누르면 새 탭에서 전체 화면으로 실행됩니다.</p>
  </div>

  <button class="btn-run" onclick="runCodeInNewWindow()">새 창에서 코드 실행하기</button>

  <script>
    async function runCodeInNewWindow() {
      try {
        // 1. 클립보드에서 텍스트 읽기
        const code = await navigator.clipboard.readText();

        if (!code || code.trim() === '') {
          alert('클립보드가 비어있거나 읽을 수 있는 텍스트가 없습니다.');
          return;
        }

        // 2. 새 창(탭) 미리 열기 (차단 방지용)
        const newWindow = window.open('', '_blank');

        if (!newWindow) {
          alert('팝업 차단이 켜져있어 새 창을 열 수 없습니다. 팝업 차단을 해제해주세요.');
          return;
        }

        // 3. HTML/JS 구분하여 실행 환경 조립
        let finalHtml = '';
        const isHtml = /<[a-z][\s\S]*>/i.test(code);

        if (isHtml) {
          finalHtml = code;
        } else {
          // 순수 JavaScript인 경우 화면에 console.log 결과가 보이도록 템플릿 적용
          finalHtml = `
            <!DOCTYPE html>
            <html>
            <head>
              <meta charset="UTF-8">
              <title>코드 실행 결과</title>
              <style>
                body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; background: #fff; color: #333; }
                h2 { font-size: 1.1rem; border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-top: 0; color: #555; }
                .log-line { font-family: monospace; border-bottom: 1px solid #eee; padding: 6px 0; word-break: break-all; font-size: 0.95rem; }
                .error { color: #dc2626; font-weight: bold; }
              </style>
            </head>
            <body>
              <h2>🖥️ JavaScript 실행 및 로그 출력 결과</h2>
              <div id="output"></div>
              <script>
                const outputDiv = document.getElementById('output');
                function appendLog(msg, isError = false) {
                  const div = document.createElement('div');
                  div.className = 'log-line' + (isError ? ' error' : '');
                  div.textContent = typeof msg === 'object' ? JSON.stringify(msg, null, 2) : msg;
                  outputDiv.appendChild(div);
                }

                console.log = function(...args) {
                  args.forEach(arg => appendLog(arg));
                };

                window.onerror = function(msg, url, line) {
                  appendLog("Error: " + msg + " (Line " + line + ")", true);
                };

                try {
                  ${code}
                } catch (err) {
                  appendLog(err.toString(), true);
                }
              <\/script>
            </body>
            </html>
          `;
        }

        // 4. 새 창에 HTML 주입 후 렌더링
        newWindow.document.open();
        newWindow.document.write(finalHtml);
        newWindow.document.close();

      } catch (err) {
        alert('클립보드 읽기 권한 거부 또는 오류 발생:\n' + err.message);
      }
    }
  </script>
</body>
</html>
