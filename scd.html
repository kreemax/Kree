<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Note</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --accent: #6366f1;
            --text-main: #f3f4f6;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* 1. 자동 전체화면 처리용 레이어 및 헤더 최소화 */
        header { padding: 10px; display: flex; justify-content: flex-end; z-index: 10; }
        .icon-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px; border-radius: 50%; width: 40px; height: 40px; }

        .screen { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        #view-screen { padding: 20px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; line-height: 1.6; padding-bottom: 80px; }
        #edit-screen { display: none; padding: 10px; }
        #editor { flex: 1; background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 16px; line-height: 1.6; }

        /* 3. 하단 버튼 고정 (이쁘게 잘 보이도록) */
        .floating-bar {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }
        .action-btn {
            flex: 1;
            background: var(--accent);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            cursor: pointer;
        }

        /* 툴바 */
        .toolbar { display: flex; gap: 5px; margin-bottom: 10px; overflow-x: auto; padding-bottom: 5px; }
        .tool-btn { background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
        .tool-btn.active { background: var(--accent); }

        /* 모달 등은 이전과 동일 */
        .modal { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.8); display: flex; align-items: flex-end; z-index: 200; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: #1a1c23; width: 100%; padding: 20px; border-radius: 20px 20px 0 0; max-height: 80vh; overflow-y: auto; }
        .input-box { width: 100%; background: #000; border: 1px solid var(--border); padding: 10px; color: white; border-radius: 8px; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- 1. 첫 터치 시 전체화면 유도 -->
    <header>
        <button class="icon-btn" onclick="openSettings()">⚙️</button>
    </header>

    <div id="view-screen" class="screen">
        <div id="viewer-content">작성된 글이 없습니다.</div>
    </div>

    <div id="edit-screen" class="screen">
        <div class="toolbar">
            <select class="tool-btn" id="fontSizeSelect" onchange="applyStyle()">
                <option value="16px">보통</option><option value="20px">크게</option>
            </select>
            <button class="tool-btn" id="bold-btn" onclick="toggleBold()"><b>B</b></button>
            <button class="tool-btn" onclick="changeAlign('left')">좌</button>
            <button class="tool-btn" onclick="changeAlign('center')">중</button>
        </div>
        <textarea id="editor" placeholder="내용을 입력하세요..."></textarea>
    </div>

    <!-- 고정 버튼 -->
    <div id="action-container" class="floating-bar">
        <button id="main-btn" class="action-btn" onclick="switchToEditMode()">수정하기</button>
    </div>

    <!-- 설정 모달 (코드 생략, 이전과 동일) -->
    <div class="modal" id="settings-modal"><div class="modal-content">...</div></div>

    <script>
        // 자동 전체화면 (첫 터치시 발동)
        document.body.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        }, { once: true });

        // 화면 전환 로직
        function switchToEditMode() {
            document.getElementById('view-screen').style.display = 'none';
            document.getElementById('edit-screen').style.display = 'flex';
            document.getElementById('main-btn').textContent = '저장 후 닫기';
            document.getElementById('main-btn').onclick = saveDataAndFinish;
        }

        function switchToViewMode() {
            document.getElementById('edit-screen').style.display = 'none';
            document.getElementById('view-screen').style.display = 'flex';
            document.getElementById('main-btn').textContent = '수정하기';
            document.getElementById('main-btn').onclick = switchToEditMode;
        }

        // 저장 로직 (이전 코드 유지)
        async function saveDataAndFinish() {
            // ... (기존 저장 로직과 동일)
            switchToViewMode();
        }
        
        // ... (나머지 로직 동일)
    </script>
</body>
</html>
