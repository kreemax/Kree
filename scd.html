<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Note</title>
    <style>
        :root { --bg-color: #0f1015; --accent: #6366f1; --text-main: #f3f4f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; background-size: cover; background-position: center; }
        
        #view-screen { flex: 1; padding: 20px; overflow-y: auto; white-space: pre-wrap; line-height: 1.6; }
        #edit-screen { display: none; flex: 1; flex-direction: column; padding: 10px; }
        #editor { flex: 1; background: transparent; border: none; color: white; width: 100%; outline: none; font-size: 16px; line-height: 1.6; }

        /* 오른쪽 하단 떠다니는 버튼 */
        .fab { position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: white; width: 60px; height: 60px; border-radius: 50%; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-size: 24px; z-index: 100; cursor: pointer; }

        /* 메뉴 모달 */
        .modal { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.85); z-index: 200; display: none; align-items: center; justify-content: center; }
        .modal-content { background: #1a1c23; width: 90%; padding: 20px; border-radius: 20px; }
        .menu-btn { width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: none; color: white; margin-bottom: 10px; border-radius: 10px; font-size: 16px; }
    </style>
</head>
<body>

    <!-- 뷰어 화면 -->
    <div id="view-screen">작성된 글이 없습니다.</div>

    <!-- 에디터 화면 -->
    <div id="edit-screen">
        <textarea id="editor" placeholder="내용을 입력하세요..."></textarea>
    </div>

    <!-- 오른쪽 하단 관리 버튼 (FAB) -->
    <button class="fab" onclick="toggleMenu()">+</button>

    <!-- 메뉴 모달 -->
    <div id="menu-modal" class="modal">
        <div class="modal-content">
            <button class="menu-btn" onclick="openEditor()">✏️ 글 수정하기</button>
            <button class="menu-btn" onclick="saveAndExit()">💾 저장 후 닫기</button>
            <button class="menu-btn" onclick="openSettings()">⚙️ 설정</button>
            <button class="menu-btn" style="background:#ef4444" onclick="toggleMenu()">닫기</button>
        </div>
    </div>

    <script>
        // 자동 전체화면
        document.body.addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
        }, { once: true });

        // 상태 관리
        const editor = document.getElementById('editor');
        const viewer = document.getElementById('view-screen');

        window.onload = () => {
            const data = localStorage.getItem('msd_data');
            if (data) {
                const parsed = JSON.parse(data);
                viewer.textContent = parsed.realData || "내용이 없습니다.";
                editor.value = parsed.realData || "";
            }
        };

        function toggleMenu() {
            const modal = document.getElementById('menu-modal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        function openEditor() {
            document.getElementById('view-screen').style.display = 'none';
            document.getElementById('edit-screen').style.display = 'flex';
            toggleMenu();
        }

        function saveAndExit() {
            const text = editor.value;
            // 로컬 스토리지에 저장
            localStorage.setItem('msd_data', JSON.stringify({ realData: text }));
            
            // 뷰어 즉시 업데이트
            viewer.textContent = text || "내용이 없습니다.";
            
            // 화면 전환
            document.getElementById('edit-screen').style.display = 'none';
            document.getElementById('view-screen').style.display = 'flex';
            toggleMenu();
        }

        function openSettings() {
            alert("설정 화면입니다. (이전 설정 로직을 여기에 연동하세요)");
            toggleMenu();
        }
    </script>
</body>
</html>
