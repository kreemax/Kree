<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Note</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: rgba(26, 28, 35, 0.95);
            --accent: #6366f1;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* 메인 뷰어 및 에디터 */
        #view-screen {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.6;
        }

        #edit-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            padding: 15px;
        }

        #editor {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            font-size: 16px;
            line-height: 1.6;
            resize: none;
        }

        /* 우측 하단 Floating 버튼 */
        .fab {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--accent);
            color: white;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: none;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.5);
            font-size: 28px;
            z-index: 100;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 에디터 서식 툴바 */
        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .tool-btn, select {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .tool-btn.active { background: var(--accent); border-color: var(--accent); }

        /* 모달 레이어 */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border-radius: 20px;
            border: 1px solid var(--border);
            max-height: 85vh;
            overflow-y: auto;
        }

        .menu-btn {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            color: white;
            margin-bottom: 10px;
            border-radius: 12px;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
        }

        .setting-item { margin-bottom: 16px; }
        .setting-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
        .setting-desc { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 8px; }

        .input-box {
            width: 100%;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            color: white;
            outline: none;
        }

        .primary-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }

        /* 암호 잠금 화면 */
        #lock-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 300;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- 잠금 레이어 -->
    <div id="lock-screen" style="display: none;">
        <div style="background: var(--card-bg); padding: 25px; border-radius: 16px; width: 100%; max-width: 320px; text-align: center; border: 1px solid var(--border);">
            <h3 style="margin-bottom: 8px;">🔒 잠김</h3>
            <p style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 15px;">AES-256 암호가 걸려있습니다.</p>
            <input type="password" id="unlock-pass" class="input-box" placeholder="비밀번호" style="margin-bottom: 12px;">
            <button class="primary-btn" onclick="unlockData()">잠금 해제</button>
        </div>
    </div>

    <!-- 메인 뷰어 화면 -->
    <div id="view-screen">내용이 없습니다. + 버튼을 눌러 작성하세요.</div>

    <!-- 에디터 화면 -->
    <div id="edit-screen">
        <div class="toolbar">
            <select id="fontSizeSelect" onchange="changeFontSize(this.value)">
                <option value="14px">14px</option>
                <option value="16px" selected>16px</option>
                <option value="20px">20px</option>
            </select>
            <button id="bold-btn" class="tool-btn" onclick="toggleBold()"><b>B</b></button>
            <button class="tool-btn" onclick="setAlign('left')">⬅️</button>
            <button class="tool-btn" onclick="setAlign('center')">↔️</button>
            <button class="tool-btn" onclick="setAlign('right')">➡️</button>
        </div>
        <textarea id="editor" placeholder="내용을 입력하세요... (자동 저장됨)" oninput="autoSave()"></textarea>
    </div>

    <!-- Floating 관리 버튼 -->
    <button class="fab" onclick="toggleMenu()">+</button>

    <!-- 메뉴 모달 -->
    <div id="menu-modal" class="modal" onclick="closeModal('menu-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="menu-btn" onclick="openEditor()">✏️ 글 작성 / 수정</button>
            <button class="menu-btn" onclick="openSettings()">⚙️ 보안 및 더미 설정</button>
            <button class="menu-btn" style="color: #ef4444;" onclick="clearAll()">🗑 모든 데이터 삭제</button>
            <button class="menu-btn" onclick="closeModal('menu-modal')">닫기</button>
        </div>
    </div>

    <!-- 설정 모달 -->
    <div id="settings-modal" class="modal" onclick="closeModal('settings-modal')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 style="margin-bottom: 15px;">보안 & 더미 설정</h3>
            
            <div class="setting-item">
                <div class="setting-title">AES 보안 잠금</div>
                <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem;">
                    <input type="checkbox" id="aes-toggle" onchange="toggleAesInput(this.checked)"> AES-256 암호화 활성화
                </label>
                <input type="password" id="cfg-pass" class="input-box" placeholder="비밀번호 설정" style="display:none; margin-top: 8px;">
            </div>

            <div class="setting-item">
                <div class="setting-title">가짜 더미 용량 (뻥튀기)</div>
                <div class="setting-desc">실제 사용 용량: <b id="usage-text" style="color:var(--accent)">0 MB</b></div>
                <select id="dummy-size" class="input-box">
                    <option value="0">더미 없음 (0 MB)</option>
                    <option value="1">1 MB 추가</option>
                    <option value="2">2 MB 추가</option>
                    <option value="3">3 MB 추가</option>
                </select>
            </div>

            <div class="setting-item">
                <div class="setting-title">배경화면 등록</div>
                <input type="file" id="bg-file" accept="image/*" style="display:none" onchange="handleBgUpload(this)">
                <button class="tool-btn" style="width: 100%; margin-top: 5px;" onclick="document.getElementById('bg-file').click()">📱 폰 사진 선택</button>
            </div>

            <button class="primary-btn" onclick="saveSettings()">설정 저장</button>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const viewer = document.getElementById('view-screen');

        let config = {
            aesEnabled: false,
            password: '',
            dummyMb: 0,
            style: { size: '16px', align: 'left', isBold: false, bgBase64: '' }
        };

        // 페이지 로드 초기화
        window.onload = async () => {
            const savedCfg = localStorage.getItem('msd_config');
            if (savedCfg) config = JSON.parse(savedCfg);

            applyStyles();
            checkUsage();

            const rawData = localStorage.getItem('msd_data');
            if (rawData && config.aesEnabled) {
                document.getElementById('lock-screen').style.display = 'flex';
            } else if (rawData) {
                try {
                    const parsed = JSON.parse(rawData);
                    updateUI(parsed.realData || '');
                } catch(e) {
                    updateUI('');
                }
            }
        };

        // 저장소 사용 용량 측정 (더미 동작 확인용)
        function checkUsage() {
            let totalBytes = 0;
            for (let key in localStorage) {
                if (localStorage.hasOwnProperty(key)) {
                    totalBytes += (localStorage[key].length * 2); // UTF-16 바이트 계산
                }
            }
            const mb = (totalBytes / (1024 * 1024)).toFixed(2);
            document.getElementById('usage-text').textContent = mb + ' MB';
        }

        // 서식 적용
        function applyStyles() {
            [editor, viewer].forEach(el => {
                el.style.fontSize = config.style.size;
                el.style.textAlign = config.style.align;
                el.style.fontWeight = config.style.isBold ? 'bold' : 'normal';
            });
            document.getElementById('fontSizeSelect').value = config.style.size;
            document.getElementById('bold-btn').className = config.style.isBold ? 'tool-btn active' : 'tool-btn';
            if (config.style.bgBase64) document.body.style.backgroundImage = `url(${config.style.bgBase64})`;
        }

        function updateUI(text) {
            editor.value = text;
            viewer.textContent = text || "내용이 없습니다. + 버튼을 눌러 작성하세요.";
        }

        // 모달 제어
        function toggleMenu() { document.getElementById('menu-modal').style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        function openEditor() {
            closeModal('menu-modal');
            viewer.style.display = 'none';
            document.getElementById('edit-screen').style.display = 'flex';
        }

        function openSettings() {
            closeModal('menu-modal');
            document.getElementById('aes-toggle').checked = config.aesEnabled;
            document.getElementById('cfg-pass').style.display = config.aesEnabled ? 'block' : 'none';
            document.getElementById('dummy-size').value = config.dummyMb;
            checkUsage();
            document.getElementById('settings-modal').style.display = 'flex';
        }

        function toggleAesInput(checked) {
            document.getElementById('cfg-pass').style.display = checked ? 'block' : 'none';
        }

        function handleBgUpload(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    config.style.bgBase64 = e.target.result;
                    applyStyles();
                };
                reader.readAsDataURL(file);
            }
        }

        function saveSettings() {
            config.aesEnabled = document.getElementById('aes-toggle').checked;
            const p = document.getElementById('cfg-pass').value;
            if (config.aesEnabled && p) config.password = p;
            config.dummyMb = parseInt(document.getElementById('dummy-size').value);

            localStorage.setItem('msd_config', JSON.stringify(config));
            closeModal('settings-modal');
            autoSave();
            alert("설정이 저장되었습니다.");
        }

        // 서식 조절
        function changeFontSize(v) { config.style.size = v; applyStyles(); saveConfigOnly(); }
        function toggleBold() { config.style.isBold = !config.style.isBold; applyStyles(); saveConfigOnly(); }
        function setAlign(a) { config.style.align = a; applyStyles(); saveConfigOnly(); }
        function saveConfigOnly() { localStorage.setItem('msd_config', JSON.stringify(config)); }

        // 더미 데이터 생성기 (특수문자 포함 무작위 데이터로 압축 우회)
        function generateDummy(sizeInMb) {
            if (sizeInMb <= 0) return '';
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()';
            const chunkSize = 1024 * 50; // 50KB Chunk
            let chunk = '';
            for (let i = 0; i < chunkSize; i++) {
                chunk += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            let result = '';
            const totalChunks = sizeInMb * 20; // 1MB = 50KB * 20
            for (let i = 0; i < totalChunks; i++) {
                result += chunk;
            }
            return result;
        }

        // 자동 저장 (타이핑 후 0.8초 뒤 저장)
        let saveTimer;
        function autoSave() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(async () => {
                const text = editor.value;
                viewer.textContent = text || "내용이 없습니다. + 버튼을 눌러 작성하세요.";

                const dummyData = generateDummy(config.dummyMb);
                let payloadData = '';

                if (config.aesEnabled && config.password) {
                    const encrypted = await encryptAES(text, config.password);
                    payloadData = JSON.stringify({
                        realLength: encrypted.length,
                        payload: encrypted + dummyData
                    });
                } else {
                    payloadData = JSON.stringify({
                        realData: text,
                        dummy: dummyData
                    });
                }

                try {
                    localStorage.setItem('msd_data', payloadData);
                    checkUsage();
                } catch (e) {
                    alert("브라우저 로컬 저장소 용량 한도를 초과했습니다. 더미 용량을 낮춰주세요.");
                }
            }, 800);
        }

        // 잠금 해제
        async function unlockData() {
            const pass = document.getElementById('unlock-pass').value;
            const rawData = localStorage.getItem('msd_data');
            try {
                const parsed = JSON.parse(rawData);
                const realEncrypted = parsed.payload.substring(0, parsed.realLength);
                const decrypted = await decryptAES(realEncrypted, pass);
                
                config.password = pass; // 메모리 세션 유지
                updateUI(decrypted);
                document.getElementById('lock-screen').style.display = 'none';
            } catch (e) {
                alert("비밀번호가 올바르지 않습니다.");
            }
        }

        function clearAll() {
            if (confirm("모든 글과 설정이 완전히 삭제됩니다. 계속하시겠습니까?")) {
                localStorage.clear();
                location.reload();
            }
        }

        // AES-GCM 256bit 암호화 엔진 (Web Crypto API)
        async function getKey(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
            return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
                keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
            );
        }

        async function encryptAES(text, password) {
            const enc = new TextEncoder();
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const key = await getKey(password, salt);
            const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, enc.encode(text));

            const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
            combined.set(salt, 0);
            combined.set(iv, salt.length);
            combined.set(new Uint8Array(encrypted), salt.length + iv.length);
            return btoa(String.fromCharCode(...combined));
        }

        async function decryptAES(cipherBase64, password) {
            const combined = Uint8Array.from(atob(cipherBase64), c => c.charCodeAt(0));
            const salt = combined.slice(0, 16);
            const iv = combined.slice(16, 28);
            const data = combined.slice(28);
            const key = await getKey(password, salt);
            const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, data);
            return new TextDecoder().decode(decrypted);
        }
    </script>
</body>
</html>
