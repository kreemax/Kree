<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MySecretDummy</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: rgba(26, 28, 35, 0.85);
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 전체 배경 어둡게 오버레이 (이미지 배경 읽기성 확보) */
        .bg-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 0;
            pointer-events: none;
        }

        /* 헤더 / 툴바 */
        header {
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-btns {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 8px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-btn:active { background: var(--border); }

        /* 화면 컨테이너 */
        .screen {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 55px);
        }

        /* 1. 첫 화면: 뷰어 */
        #view-screen {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        #viewer-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.6;
        }

        .bottom-bar {
            padding: 12px 16px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
        }

        /* 2. 수정 화면: 에디터 및 서식 */
        #edit-screen {
            display: none;
            flex-direction: column;
            height: 100%;
        }

        .editor-tools {
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            display: flex;
            gap: 8px;
            align-items: center;
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
        }

        .tool-btn, select {
            background: rgba(0, 0, 0, 0.4);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            cursor: pointer;
            outline: none;
            font-weight: normal;
        }

        .tool-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .tool-btn.danger {
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.3);
        }

        #editor {
            flex: 1;
            padding: 16px;
            border: none;
            outline: none;
            background: transparent;
            color: #ffffff;
            font-size: 16px;
            line-height: 1.6;
            resize: none;
            width: 100%;
        }

        /* 설정 모달 */
        .modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 24px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            max-height: 85vh;
            overflow-y: auto;
            border-top: 1px solid var(--border);
        }

        .modal.active .modal-content { transform: translateY(0); }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title { font-size: 1.1rem; font-weight: 600; }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }

        .setting-label {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .setting-title { font-size: 0.9rem; font-weight: 500; }
        .setting-desc { font-size: 0.75rem; color: var(--text-sub); }

        /* 토글 스위치 */
        .switch {
            position: relative;
            display: inline-block;
            width: 46px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.2);
            transition: .3s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 18px; width: 18px; left: 4px; bottom: 4px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(20px); }

        .input-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            color: var(--text-main);
            margin-top: 8px;
            outline: none;
        }

        .primary-btn {
            width: 100%;
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .primary-btn:active { background: var(--accent-hover); }

        /* 파일 업로드 숨김 */
        #bg-file-input { display: none; }

        /* 잠금 화면 */
        #lock-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            z-index: 200;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            text-align: center;
        }

        .lock-card {
            background: var(--card-bg);
            padding: 28px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>

    <!-- 잠금 레이어 -->
    <div id="lock-screen" style="display: none;">
        <div class="lock-card">
            <h2 style="margin-bottom: 8px;">🔒 잠금 상태</h2>
            <p style="color: var(--text-sub); font-size: 0.85rem; margin-bottom: 20px;">
                AES-GCM 암호화가 적용되어 있습니다.<br>비밀번호를 입력하세요.
            </p>
            <input type="password" id="unlock-pass" class="input-box" placeholder="비밀번호" style="margin-bottom: 12px;">
            <button class="primary-btn" onclick="unlockData()">잠금 해제</button>
        </div>
    </div>

    <!-- 헤더 -->
    <header>
        <div class="logo">MySecretDummy</div>
        <div class="header-btns">
            <!-- 0. 전체화면 버튼 -->
            <button class="icon-btn" onclick="toggleFullScreen()" title="전체화면">⛶</button>
        </div>
    </header>

    <!-- 1. 첫 화면: 뷰어 화면 (기본 노출) -->
    <div id="view-screen" class="screen">
        <div id="viewer-content">저장된 내용이 없습니다. '수정 및 설정'을 눌러 작성해주세요.</div>
        <div class="bottom-bar">
            <!-- 1. 수정 누르면 에디터로 들어가 설정 가능 -->
            <button class="primary-btn" onclick="switchToEditMode()">✏️ 수정 및 설정</button>
        </div>
    </div>

    <!-- 2. 수정 화면: 에디터 및 서식 설정 -->
    <div id="edit-screen" class="screen">
        <!-- 서식 툴바 -->
        <div class="editor-tools">
            <select id="fontSizeSelect" onchange="changeFontSize(this.value)">
                <option value="14px">14px</option>
                <option value="16px">16px</option>
                <option value="20px">20px</option>
                <option value="24px">24px</option>
            </select>
            <!-- 3. 진하게(Bold) 기능 -->
            <button id="bold-btn" class="tool-btn" onclick="toggleBold()"><b>B</b></button>
            <button class="tool-btn" onclick="changeAlign('left')">⬅️</button>
            <button class="tool-btn" onclick="changeAlign('center')">↔️</button>
            <button class="tool-btn" onclick="changeAlign('right')">➡️</button>
            <button class="tool-btn danger" onclick="clearText()">삭제</button>
        </div>

        <textarea id="editor" placeholder="비밀 메모를 작성하세요..."></textarea>

        <div class="bottom-bar" style="display: flex; gap: 8px;">
            <button class="tool-btn" style="flex: 1;" onclick="openSettings()">⚙️ 보안/배경 설정</button>
            <button class="primary-btn" style="flex: 1;" onclick="saveDataAndFinish()">💾 저장 후 완료</button>
        </div>
    </div>

    <!-- 설정 모달 -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">보안 및 스타일 설정</div>
                <button class="icon-btn" onclick="closeSettings()">✕</button>
            </div>

            <!-- 4. 배경화면 등록 (폰 내부 이미지 파일 -> Base64 코드화) -->
            <div class="setting-item" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                <div class="setting-label">
                    <div class="setting-title">폰 내부 배경화면 지정</div>
                    <div class="setting-desc">기기 내부 사진을 코드로 변환하여 저장합니다.</div>
                </div>
                <input type="file" id="bg-file-input" accept="image/*" onchange="handleImageUpload(this)">
                <div style="display: flex; gap: 8px; width: 100%;">
                    <button class="tool-btn" style="flex: 1;" onclick="document.getElementById('bg-file-input').click()">📱 사진 선택/등록하기</button>
                    <button class="tool-btn danger" onclick="removeBgImage()">배경 삭제</button>
                </div>
            </div>

            <!-- AES 락 설정 -->
            <div class="setting-item">
                <div class="setting-label">
                    <div class="setting-title">AES 보안 잠금</div>
                    <div class="setting-desc">비밀번호 기반 AES-GCM 256비트 암호화</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="aes-toggle" onchange="toggleAesConfig(this.checked)">
                    <span class="slider"></span>
                </label>
            </div>

            <div id="password-config" style="display: none; margin-bottom: 16px;">
                <input type="password" id="cfg-pass" class="input-box" placeholder="비밀번호 설정">
            </div>

            <!-- 더미 데이터 용량 설정 -->
            <div class="setting-item" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                <div class="setting-label">
                    <div class="setting-title">더미 데이터 (용량 뻥튀기)</div>
                    <div class="setting-desc">의미 없는 무작위 용량을 추가해 위장합니다.</div>
                </div>
                <select id="dummy-size" class="input-box">
                    <option value="0">더미 없음 (0 MB)</option>
                    <option value="1">1 MB 추가</option>
                    <option value="3">3 MB 추가</option>
                    <option value="5">5 MB 추가</option>
                </select>
            </div>

            <button class="primary-btn" style="margin-top: 16px;" onclick="saveSettings()">설정 저장</button>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const viewerContent = document.getElementById('viewer-content');
        const lockScreen = document.getElementById('lock-screen');
        const modal = document.getElementById('settings-modal');

        // 2. 서식 및 상태 통합 관리
        let config = {
            aesEnabled: false,
            password: '',
            dummyMb: 0,
            style: {
                fontSize: '16px',
                textAlign: 'left',
                isBold: false,
                bgBase64: ''
            }
        };

        // 앱 초기화
        window.onload = () => {
            const savedConfig = localStorage.getItem('msd_config');
            if (savedConfig) {
                config = JSON.parse(savedConfig);
                document.getElementById('aes-toggle').checked = config.aesEnabled;
                document.getElementById('dummy-size').value = config.dummyMb;
                if(config.aesEnabled) document.getElementById('password-config').style.display = 'block';
            }

            // 저장된 서식 적용
            applyStylesToUI();

            const rawData = localStorage.getItem('msd_data');
            if (rawData) {
                if (config.aesEnabled) {
                    lockScreen.style.display = 'flex';
                } else {
                    const payload = JSON.parse(rawData);
                    updateContentUI(payload.realData);
                }
            }
        };

        // 0. 전체화면 처리
        function toggleFullScreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`전체화면을 지원하지 않는 브라우저입니다: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        // 1. 화면 전환 (뷰어 <-> 에디터)
        function switchToEditMode() {
            document.getElementById('view-screen').style.display = 'none';
            document.getElementById('edit-screen').style.display = 'flex';
        }

        function switchToViewMode() {
            document.getElementById('edit-screen').style.display = 'none';
            document.getElementById('view-screen').style.display = 'flex';
        }

        // 2 & 3. 서식 적용 및 유지 로직
        function applyStylesToUI() {
            const st = config.style || { fontSize: '16px', textAlign: 'left', isBold: false, bgBase64: '' };
            
            // 뷰어 및 에디터 서식 반영
            [editor, viewerContent].forEach(el => {
                el.style.fontSize = st.fontSize;
                el.style.textAlign = st.textAlign;
                el.style.fontWeight = st.isBold ? 'bold' : 'normal';
            });

            document.getElementById('fontSizeSelect').value = st.fontSize;
            
            const boldBtn = document.getElementById('bold-btn');
            if (st.isBold) boldBtn.classList.add('active');
            else boldBtn.classList.remove('active');

            // 4. 배경 이미지 반영
            if (st.bgBase64) {
                document.body.style.backgroundImage = `url(${st.bgBase64})`;
            } else {
                document.body.style.backgroundImage = 'none';
            }
        }

        function changeFontSize(size) {
            config.style.fontSize = size;
            applyStylesToUI();
        }

        function changeAlign(align) {
            config.style.textAlign = align;
            applyStylesToUI();
        }

        function toggleBold() {
            config.style.isBold = !config.style.isBold;
            applyStylesToUI();
        }

        function updateContentUI(text) {
            editor.value = text;
            viewerContent.textContent = text || "작성된 내용이 없습니다.";
        }

        function clearText() {
            if (confirm("정말 모두 삭제하시겠습니까?")) {
                editor.value = '';
            }
        }

        // 4. 이미지 파일을 Base64 코드로 변환하여 저장
        function handleImageUpload(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    config.style.bgBase64 = e.target.result;
                    applyStylesToUI();
                    alert("배경화면이 적용되었습니다. 설정 저장 시 고정됩니다.");
                };
                reader.readAsDataURL(file);
            }
        }

        function removeBgImage() {
            config.style.bgBase64 = '';
            applyStylesToUI();
            alert("배경화면이 제거되었습니다.");
        }

        // 설정 제어
        function openSettings() { modal.classList.add('active'); }
        function closeSettings() { modal.classList.remove('active'); }
        function toggleAesConfig(enabled) {
            document.getElementById('password-config').style.display = enabled ? 'block' : 'none';
        }

        function saveSettings() {
            const enabled = document.getElementById('aes-toggle').checked;
            const newPass = document.getElementById('cfg-pass').value;

            if (enabled && !config.aesEnabled && !newPass) {
                alert('AES 잠금을 켜려면 비밀번호를 입력해야 합니다.');
                return;
            }

            config.aesEnabled = enabled;
            if (newPass) config.password = newPass;
            config.dummyMb = parseInt(document.getElementById('dummy-size').value);

            localStorage.setItem('msd_config', JSON.stringify(config));
            alert('설정이 저장되었습니다.');
            closeSettings();
        }

        // 저장 및 저장 후 완료 처리
        async function saveDataAndFinish() {
            const text = editor.value;
            let finalDataToStore = '';

            // 더미 데이터 생성
            const dummyLength = config.dummyMb * 1024 * 1024;
            const dummyChunk = 'X'.repeat(dummyLength);

            if (config.aesEnabled) {
                if (!config.password) {
                    alert('설정에서 비밀번호를 지정해 주세요.');
                    return;
                }
                const encryptedText = await encryptAES(text, config.password);
                finalDataToStore = JSON.stringify({
                    realLength: encryptedText.length,
                    payload: encryptedText + dummyChunk
                });
            } else {
                finalDataToStore = JSON.stringify({
                    realLength: text.length,
                    realData: text,
                    dummy: dummyChunk
                });
            }

            try {
                // 서식 및 설정 통합 저장
                localStorage.setItem('msd_config', JSON.stringify(config));
                localStorage.setItem('msd_data', finalDataToStore);
                
                updateContentUI(text);
                switchToViewMode();
            } catch (e) {
                alert('저장 실패: 이미지 용량이 너무 크거나 더미 데이터 용량을 초과했습니다.');
            }
        }

        async function unlockData() {
            const passInput = document.getElementById('unlock-pass').value;
            const rawData = localStorage.getItem('msd_data');
            if (!rawData) return;

            try {
                const parsed = JSON.parse(rawData);
                const realEncrypted = parsed.payload.substring(0, parsed.realLength);
                const decryptedText = await decryptAES(realEncrypted, passInput);
                
                updateContentUI(decryptedText);
                lockScreen.style.display = 'none';
                document.getElementById('unlock-pass').value = '';
            } catch (err) {
                alert('비밀번호가 올바르지 않습니다.');
            }
        }

        // Web Crypto API (PBKDF2 + AES-GCM 256bit)
        async function getKey(password, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await crypto.subtle.importKey(
                "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
            );
            return crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt", "decrypt"]
            );
        }

        async function encryptAES(text, password) {
            const enc = new TextEncoder();
            const salt = crypto.getRandomValues(new Uint8Array(16));
            const iv = crypto.getRandomValues(new Uint8Array(12));
            const key = await getKey(password, salt);

            const encrypted = await crypto.subtle.encrypt(
                { name: "AES-GCM", iv: iv },
                key,
                enc.encode(text)
            );

            const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
            combined.set(salt, 0);
            combined.set(iv, salt.length);
            combined.set(new Uint8Array(encrypted), salt.length + iv.length);

            return btoa(String.fromCharCode(...combined));
        }

        async function decryptAES(cipherBase64, password) {
            const combined = Uint8Array.from(atob(cipherBase64), c => c.charCodeAt(0));
            const salt = combined.slice(0, 16);
            const iv = combined.slice(16, 28);
            const data = combined.slice(28);

            const key = await getKey(password, salt);
            const decrypted = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv: iv },
                key,
                data
            );

            return new TextDecoder().decode(decrypted);
        }
    </script>
</body>
</html>
