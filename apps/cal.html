<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스마트 블랙 계산기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .calculator-container {
      width: 100%;
      max-width: 420px;
      background: #0d0d0d;
      border: 1px solid #222;
      border-radius: 28px;
      padding: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    /* 1. 이쁘게 개선된 상단 공식 선택 드롭다운 */
    .formula-bar {
      position: relative;
      width: 100%;
    }

    .formula-select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      background: linear-gradient(145deg, #18181a, #101012);
      border: 1px solid #00e5ff55;
      border-radius: 14px;
      color: #00e5ff;
      padding: 10px 38px 10px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      outline: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 229, 255, 0.05);
      transition: all 0.2s ease;
    }

    .formula-select:focus {
      border-color: #00e5ff;
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
    }

    /* 드롭다운 커스텀 화살표 아이콘 */
    .formula-bar::after {
      content: '▼';
      font-size: 0.65rem;
      color: #00e5ff;
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    .formula-select option {
      background-color: #141414;
      color: #ffffff;
      padding: 10px;
    }

    /* 디스플레이 영역 */
    .display-area {
      background: #141414;
      border: 1px solid #282828;
      border-radius: 20px;
      padding: 18px 16px;
      text-align: right;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 120px;
      word-break: break-all;
    }

    .expression {
      color: #888;
      font-size: 1rem;
      min-height: 1.4rem;
      margin-bottom: 6px;
    }

    .result {
      color: #ffffff;
      font-size: 2rem;
      font-weight: 700;
      line-height: 1.2;
      white-space: pre-wrap;
    }

    .korean-result {
      color: #00e5ff;
      font-size: 0.95rem;
      margin-top: 8px;
      font-weight: 600;
      min-height: 1.2rem;
    }

    /* 키패드 */
    .keypad {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      outline: none;
      border: none;
      height: 56px;
      border-radius: 16px;
      font-size: 1.3rem;
      font-weight: 600;
      color: #ffffff;
      background: #1c1c1e;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    button:active {
      background: #333336;
      transform: scale(0.96);
    }

    button.operator { background: #2c2c2e; color: #00e5ff; }
    button.func { background: #2a2a2c; color: #ff9f0a; }
    button.sci { background: #2a2a2c; color: #d4a5ff; }
    button.equal { background: #30d158; color: #000000; font-weight: 800; }
    button.save-btn { background: #0a84ff; color: #ffffff; font-size: 1rem; }

    /* 저장 섹션 */
    .saved-section {
      background: #141414;
      border: 1px solid #282828;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-title {
      font-size: 0.95rem;
      color: #aaa;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }

    .config-btn {
      background: #2c2c2e;
      color: #00e5ff;
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 0.8rem;
      height: auto;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .saved-list {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .saved-item {
      background: #1c1c1e;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .saved-val {
      font-size: 1rem;
      word-break: break-all;
      color: #fff;
      font-weight: 600;
      max-width: 60%;
    }

    .saved-actions {
      display: flex;
      gap: 6px;
    }

    .action-btn {
      height: 32px;
      padding: 0 10px;
      font-size: 0.75rem;
      border-radius: 8px;
    }

    .action-btn.convert { background: #5e5ce6; color: #fff; }
    .action-btn.apply { background: #30d158; color: #000; font-weight: bold; }
    .action-btn.delete { background: #ff453a; color: #fff; }

    /* 모달 */
    .modal-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 28px;
      display: none;
      flex-direction: column;
      padding: 20px;
      z-index: 100;
    }

    .modal-overlay.active { display: flex; }

    .modal-tab {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .tab-btn {
      flex: 1;
      height: 36px;
      font-size: 0.85rem;
      background: #2c2c2e;
      border-radius: 10px;
    }

    .tab-btn.active {
      background: #00e5ff;
      color: #000;
      font-weight: bold;
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .map-row {
      display: flex;
      align-items: center;
      background: #1c1c1e;
      padding: 6px 10px;
      border-radius: 10px;
      gap: 8px;
    }

    .map-row span { font-weight: bold; color: #00e5ff; width: 20px; }

    .map-row input, .formula-input-group input {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 6px;
      color: #fff;
      padding: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    .formula-input-group {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }

    .formula-manage-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1c1c1e;
      padding: 8px 12px;
      border-radius: 10px;
    }

    .close-btn {
      background: #30d158;
      color: #000;
      width: 100%;
      margin-top: 14px;
      height: 44px;
      font-size: 1rem;
    }
  </style>
</head>
<body>

<div class="calculator-container">
  <!-- 모달 창 -->
  <div class="modal-overlay" id="modal">
    <div class="modal-tab">
      <button class="tab-btn active" id="tabMapBtn" onclick="switchTab('map')">치환 규칙</button>
      <button class="tab-btn" id="tabFormulaBtn" onclick="switchTab('formula')">공식 목록 관리</button>
    </div>

    <!-- 치환 규칙 탭 -->
    <div class="modal-body" id="mapTabBody">
      <div class="modal-grid" id="modalGrid"></div>
    </div>

    <!-- 공식 목록 관리 탭 -->
    <div class="modal-body" id="formulaTabBody" style="display: none;">
      <div class="formula-input-group">
        <input type="text" id="newFormulaName" placeholder="공식 이름 (예: 2의 10승)">
        <input type="text" id="newFormulaExpr" placeholder="수식 (예: 2^10)">
        <button style="height: auto; width: 60px; font-size: 0.8rem; background: #0a84ff;" onclick="addCustomFormula()">추가</button>
      </div>
      <div id="formulaManageList" style="display: flex; flex-direction: column; gap: 6px;"></div>
    </div>

    <button class="close-btn" onclick="toggleModal(false)">완료</button>
  </div>

  <!-- 1. 이쁘게 개선된 상단 공식 선택 바 -->
  <div class="formula-bar">
    <select class="formula-select" id="formulaSelect" onchange="applyFormula(this.value)">
      <option value="">📐 자주 쓰는 공식 선택...</option>
    </select>
  </div>

  <!-- 디스플레이 -->
  <div class="display-area">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
    <div class="korean-result" id="koreanResult"></div>
  </div>

  <!-- 키패드 -->
  <div class="keypad">
    <button class="func" onclick="clearAll()">AC</button>
    <button class="func" onclick="deleteLast()">⌫</button>
    <button class="sci" onclick="appendSymbol('(')">(</button>
    <button class="sci" onclick="appendSymbol(')')">)</button>

    <button class="sci" onclick="appendSquare()">x²</button>
    <button class="sci" onclick="appendPower()">xʸ</button>
    <button class="sci" onclick="appendLightSpeed()">c</button>
    <button class="operator" onclick="appendOp('÷')">÷</button>

    <button onclick="appendNum('7')">7</button>
    <button onclick="appendNum('8')">8</button>
    <button onclick="appendNum('9')">9</button>
    <button class="operator" onclick="appendOp('×')">×</button>

    <button onclick="appendNum('4')">4</button>
    <button onclick="appendNum('5')">5</button>
    <button onclick="appendNum('6')">6</button>
    <button class="operator" onclick="appendOp('-')">-</button>

    <button onclick="appendNum('1')">1</button>
    <button onclick="appendNum('2')">2</button>
    <button onclick="appendNum('3')">3</button>
    <button class="operator" onclick="appendOp('+')">+</button>

    <button onclick="appendNum('0')">0</button>
    <button onclick="appendNum('.')">.</button>
    <button class="save-btn" onclick="saveCurrentResult()">💾 저장</button>
    <button class="equal" onclick="calculate()">=</button>
  </div>

  <!-- 저장 섹션 -->
  <div class="saved-section">
    <div class="section-title">
      <span>💾 저장된 목록</span>
      <button class="config-btn" onclick="toggleModal(true)">⚙️ 설정</button>
    </div>
    <div class="saved-list" id="savedList">
      <div style="color: #666; font-size: 0.8rem; text-align: center; padding: 10px;">저장된 결과가 없습니다.</div>
    </div>
  </div>
</div>

<script>
  let currentInput = '0';
  let lastExpression = '';
  let isCalculated = false;

  const LIGHT_SPEED = '299792458';

  // 2. 데이터 유지(LocalStorage) 로드
  let savedResults = JSON.parse(localStorage.getItem('savedResults')) || [];
  let mappingRules = JSON.parse(localStorage.getItem('mappingRules')) || {
    '1': 'a', '2': '!', '3': '>', '4': '@', '5': '#',
    '6': '$', '7': '%', '8': '^', '9': '*', '0': 'z'
  };
  let formulaList = JSON.parse(localStorage.getItem('formulaList')) || [
    { name: '2의 10승', expr: '2^10' },
    { name: '2의 30승', expr: '2^30' },
    { name: '빛의 에너지 (E=mc²)', expr: '299792458^2' },
    { name: '원 넓이 (반지름 10)', expr: '3.14159265*10^2' },
    { name: '피타고라스 (3²+4²)', expr: '3^2+4^2' }
  ];

  const resultEl = document.getElementById('result');
  const exprEl = document.getElementById('expression');
  const koreanEl = document.getElementById('koreanResult');
  const savedListEl = document.getElementById('savedList');
  const formulaSelectEl = document.getElementById('formulaSelect');

  function saveDataToStorage() {
    localStorage.setItem('savedResults', JSON.stringify(savedResults));
    localStorage.setItem('mappingRules', JSON.stringify(mappingRules));
    localStorage.setItem('formulaList', JSON.stringify(formulaList));
  }

  // 3. 연산자 뒤에 공식/저장된 값 입력 시 자연스럽게 연결
  function applyFormula(expr) {
    if (!expr) return;
    
    // 복잡한 공식일 경우 괄호로 감싸 안전하게 처리
    const formattedExpr = (expr.includes('+') || expr.includes('-') || expr.includes('*') || expr.includes('/')) && !expr.startsWith('(') 
      ? `(${expr})` 
      : expr;

    if (isCalculated || currentInput === '0') {
      currentInput = formattedExpr;
      isCalculated = false;
    } else {
      const lastChar = currentInput.slice(-1);
      if (['+', '-', '×', '÷', '('].includes(lastChar)) {
        currentInput += formattedExpr;
      } else {
        currentInput += '×' + formattedExpr;
      }
    }
    updateDisplay();
    formulaSelectEl.value = ""; 
  }

  function renderFormulaOptions() {
    formulaSelectEl.innerHTML = '<option value="">📐 자주 쓰는 공식 선택...</option>';
    const manageList = document.getElementById('formulaManageList');
    manageList.innerHTML = '';

    formulaList.forEach((item, index) => {
      formulaSelectEl.innerHTML += `<option value="${item.expr}">${item.name} (${item.expr})</option>`;

      manageList.innerHTML += `
        <div class="formula-manage-item">
          <span style="font-size:0.85rem;"><b>${item.name}</b>: <code style="color:#00e5ff;">${item.expr}</code></span>
          <button style="height:26px; width:40px; font-size:0.7rem; background:#ff453a;" onclick="removeCustomFormula(${index})">삭제</button>
        </div>
      `;
    });
  }

  function addCustomFormula() {
    const name = document.getElementById('newFormulaName').value.trim();
    const expr = document.getElementById('newFormulaExpr').value.trim();
    if (name && expr) {
      formulaList.push({ name, expr });
      document.getElementById('newFormulaName').value = '';
      document.getElementById('newFormulaExpr').value = '';
      saveDataToStorage();
      renderFormulaOptions();
    }
  }

  function removeCustomFormula(index) {
    formulaList.splice(index, 1);
    saveDataToStorage();
    renderFormulaOptions();
  }

  function switchTab(tab) {
    document.getElementById('tabMapBtn').classList.toggle('active', tab === 'map');
    document.getElementById('tabFormulaBtn').classList.toggle('active', tab === 'formula');
    document.getElementById('mapTabBody').style.display = tab === 'map' ? 'flex' : 'none';
    document.getElementById('formulaTabBody').style.display = tab === 'formula' ? 'flex' : 'none';
  }

  function initModalGrid() {
    const grid = document.getElementById('modalGrid');
    grid.innerHTML = '';
    for (let i = 0; i <= 9; i++) {
      const num = String(i);
      grid.innerHTML += `
        <div class="map-row">
          <span>${num}</span>
          <input type="text" maxlength="2" value="${mappingRules[num] || ''}" onchange="updateRule('${num}', this.value)">
        </div>
      `;
    }
  }

  function updateRule(num, val) { 
    mappingRules[num] = val; 
    saveDataToStorage();
  }

  function toggleModal(show) {
    document.getElementById('modal').classList.toggle('active', show);
  }

  function appendNum(num) {
    if (isCalculated) {
      currentInput = num === '.' ? '0.' : num;
      isCalculated = false;
    } else {
      if (currentInput === '0' && num !== '.') {
        currentInput = num;
      } else {
        if (num === '.' && currentInput.slice(-1) === '.') return;
        currentInput += num;
      }
    }
    updateDisplay();
  }

  function appendSymbol(sym) {
    if (isCalculated) { currentInput = sym; isCalculated = false; } 
    else { currentInput = (currentInput === '0') ? sym : currentInput + sym; }
    updateDisplay();
  }

  function appendSquare() {
    if (isCalculated) isCalculated = false;
    currentInput += '²';
    updateDisplay();
  }

  function appendPower() {
    if (isCalculated) isCalculated = false;
    const lastChar = currentInput.slice(-1);
    if (!['+', '-', '×', '÷', '^'].includes(lastChar)) currentInput += '^';
    updateDisplay();
  }

  function appendLightSpeed() {
    if (isCalculated || currentInput === '0') {
      currentInput = LIGHT_SPEED;
      isCalculated = false;
    } else {
      const lastChar = currentInput.slice(-1);
      currentInput += ['+', '-', '×', '÷', '('].includes(lastChar) ? LIGHT_SPEED : '×' + LIGHT_SPEED;
    }
    updateDisplay();
  }

  function appendOp(op) {
    isCalculated = false;
    const lastChar = currentInput.slice(-1);
    if (['+', '-', '×', '÷'].includes(lastChar)) {
      currentInput = currentInput.slice(0, -1) + op;
    } else {
      currentInput += op;
    }
    updateDisplay();
  }

  function clearAll() {
    currentInput = '0';
    lastExpression = '';
    isCalculated = false;
    updateDisplay();
  }

  function deleteLast() {
    if (isCalculated) { clearAll(); return; }
    currentInput = currentInput.length > 1 ? currentInput.slice(0, -1) : '0';
    updateDisplay();
  }

  function formatFullString(num) {
    if (typeof num !== 'number') return String(num);
    let str = String(num);
    if (str.includes('e') || str.includes('E')) {
      let [base, exp] = str.toLowerCase().split('e');
      exp = parseInt(exp, 10);
      if (exp > 0) {
        let parts = base.split('.');
        let dec = parts[1] || '';
        str = exp >= dec.length 
          ? parts[0] + dec + '0'.repeat(exp - dec.length)
          : parts[0] + dec.slice(0, exp) + '.' + dec.slice(exp);
      } else {
        let parts = base.split('.');
        let intPart = parts[0].replace('-', '');
        let decPart = parts[1] || '';
        let sign = base.startsWith('-') ? '-' : '';
        str = sign + '0.' + '0'.repeat(Math.abs(exp) - 1) + intPart + decPart;
      }
    }
    return str;
  }

  function toKoreanNumber(numStr) {
    if (!numStr || numStr === 'Error') return '';
    let clean = numStr.split('.')[0].replace(/[^0-9]/g, '');
    if (!clean || clean === '0') return '0';

    const units = ['', '만', '억', '조', '경', '해', '자', '양', '구', '간', '정', '재', '극'];
    let result = [];
    let len = clean.length;

    for (let i = 0; i < len; i += 4) {
      let chunk = parseInt(clean.substring(Math.max(0, len - i - 4), len - i), 10);
      if (chunk > 0) {
        let unitIdx = i / 4;
        if (unitIdx < units.length) {
          result.unshift(chunk.toLocaleString() + units[unitIdx]);
        }
      }
    }
    return result.length > 0 ? result.join(' ') : '';
  }

  function calculate() {
    try {
      lastExpression = currentInput;
      let expr = currentInput.replace(/×/g, '*').replace(/÷/g, '/');
      expr = expr.replace(/²/g, '**2').replace(/\^/g, '**');

      let val = eval(expr);
      if (!isFinite(val)) throw new Error();

      currentInput = formatFullString(val);
      isCalculated = true;
    } catch (e) {
      currentInput = 'Error';
      isCalculated = true;
    }
    updateDisplay();
  }

  function updateDisplay() {
    exprEl.innerText = lastExpression;
    resultEl.innerText = currentInput;

    if (currentInput !== 'Error' && !isNaN(currentInput.replace(/,/g, ''))) {
      koreanEl.innerText = toKoreanNumber(currentInput);
    } else {
      koreanEl.innerText = '';
    }
  }

  function saveCurrentResult() {
    if (currentInput === 'Error') return;
    savedResults.push({ original: currentInput, isConverted: false });
    saveDataToStorage();
    renderSavedList();
  }

  function transformString(str) {
    return str.split('').map(ch => mappingRules[ch] !== undefined ? mappingRules[ch] : ch).join('');
  }

  function toggleConvert(index) {
    savedResults[index].isConverted = !savedResults[index].isConverted;
    saveDataToStorage();
    renderSavedList();
  }

  // 3. 저장된 값 가져와서 연산 시 뒤이어 적용
  function applySaved(index) {
    const item = savedResults[index];
    const val = item.isConverted ? transformString(item.original) : item.original;
    
    if (isCalculated || currentInput === '0') {
      currentInput = val;
      isCalculated = false;
    } else {
      const lastChar = currentInput.slice(-1);
      if (['+', '-', '×', '÷', '('].includes(lastChar)) {
        currentInput += val;
      } else {
        currentInput += '×' + val;
      }
    }
    updateDisplay();
  }

  function deleteSaved(index) {
    savedResults.splice(index, 1);
    saveDataToStorage();
    renderSavedList();
  }

  function renderSavedList() {
    if (savedResults.length === 0) {
      savedListEl.innerHTML = '<div style="color: #666; font-size: 0.8rem; text-align: center; padding: 10px;">저장된 결과가 없습니다.</div>';
      return;
    }

    savedListEl.innerHTML = savedResults.map((item, idx) => {
      const displayVal = item.isConverted ? transformString(item.original) : item.original;
      return `
        <div class="saved-item">
          <div class="saved-val">${displayVal}</div>
          <div class="saved-actions">
            <button class="action-btn apply" onclick="applySaved(${idx})">입력</button>
            <button class="action-btn convert" onclick="toggleConvert(${idx})">${item.isConverted ? '원본' : '변환'}</button>
            <button class="action-btn delete" onclick="deleteSaved(${idx})">삭제</button>
          </div>
        </div>
      `;
    }).join('');
  }

  // 초기 실행
  initModalGrid();
  renderFormulaOptions();
  renderSavedList();
</script>

</body>
</html>
