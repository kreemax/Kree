<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>웹앱 런처</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 20px;
      transition: background-color 0.3s;
    }

    .main-title {
      width: 100%;
      max-width: 420px;
      text-align: center;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 30px;
      letter-spacing: -0.5px;
      word-break: break-all;
    }

    .action-bar {
      width: 100%;
      max-width: 420px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      padding: 0 8px 12px;
      position: relative;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 24px;
      cursor: pointer;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    .dropdown-menu {
      position: absolute;
      top: 42px;
      right: 8px;
      width: 230px;
      background-color: #2c2c2e;
      border-radius: 18px;
      padding: 8px 0;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      display: none;
      z-index: 100;
    }

    .dropdown-menu.show {
      display: block;
    }

    .menu-item {
      padding: 12px 18px;
      font-size: 15px;
      color: #e5e5e7;
      cursor: pointer;
    }

    .menu-item:active {
      background-color: #3a3a3c;
    }

    .menu-divider {
      height: 1px;
      background-color: #3a3a3c;
      margin: 6px 0;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      background-color: #1c1c1e;
      border-radius: 28px;
      padding: 24px 16px;
      min-height: 480px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      transition: background-color 0.3s;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px 12px;
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      cursor: pointer;
    }

    .app-icon {
      width: 58px;
      height: 58px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.1s;
      position: relative;
    }

    .app-item:active .app-icon {
      transform: scale(0.92);
    }

    .app-name {
      margin-top: 6px;
      font-size: 12px;
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e1e1e1;
    }

    /* 잠금 표시 (🔒) */
    .app-lock-indicator {
      position: absolute;
      top: 2px;
      right: 4px;
      font-size: 10px;
    }

    .delete-badge {
      position: absolute;
      top: -4px;
      right: 2px;
      width: 22px;
      height: 22px;
      background-color: #ff453a;
      color: white;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
    }

    .edit-badge {
      position: absolute;
      top: -4px;
      left: 2px;
      width: 22px;
      height: 22px;
      background-color: #30d158;
      color: white;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .reorder-controls {
      display: none;
      gap: 6px;
      margin-top: 4px;
    }

    .reorder-btn {
      background: #3a3a3c;
      border: none;
      color: #fff;
      border-radius: 6px;
      width: 22px;
      height: 20px;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .editing .delete-badge { display: flex; }
    .editing .edit-badge { display: flex; }
    .editing .reorder-controls { display: flex; }

    .sub-page {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #000000;
      z-index: 200;
      display: none;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 20px;
      overflow-y: auto;
    }

    .sub-page.active { display: flex; }

    .page-header {
      width: 100%;
      max-width: 420px;
      display: flex;
      align-items: center;
      padding: 20px 0;
      gap: 12px;
    }

    .back-btn {
      font-size: 24px;
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }

    .page-title {
      font-size: 20px;
      font-weight: 700;
    }

    .settings-card {
      width: 100%;
      max-width: 420px;
      background-color: #1c1c1e;
      border-radius: 24px;
      padding: 8px 16px;
      margin-bottom: 20px;
    }

    .setting-item {
      padding: 16px 0;
      border-bottom: 1px solid #2c2c2e;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .setting-item:last-child { border-bottom: none; }

    .setting-label {
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
    }

    .setting-desc {
      font-size: 13px;
      color: #0a84ff;
    }

    .setting-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #3a3a3c;
      background-color: #2c2c2e;
      color: #fff;
      font-size: 14px;
    }

    .color-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .color-row input[type="color"] {
      width: 40px;
      height: 36px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: none;
    }

    /* 토글 스위치 디자인 */
    .switch-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 26px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #3a3a3c;
      transition: .3s;
      border-radius: 26px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: #30d158; }
    input:checked + .slider:before { transform: translateX(20px); }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 300;
      padding: 20px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background-color: #2c2c2e;
      width: 100%;
      max-width: 340px;
      border-radius: 20px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      text-align: center;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel { background-color: #3a3a3c; color: #fff; }
    .btn-submit { background-color: #0a84ff; color: #fff; }
  </style>
</head>
<body>

  <div class="main-title" id="mainTitleDisplay">보안 폴더</div>

  <div class="action-bar">
    <button class="icon-btn" id="addBtn" title="파일 추가">+</button>
    <button class="icon-btn" id="menuBtn">⋮</button>

    <div class="dropdown-menu" id="dropdownMenu">
      <div class="menu-item" id="menuToggleEdit">애플리케이션 편집/삭제</div>
      <div class="menu-divider"></div>
      <div class="menu-item" id="menuEditLauncher">나만의 앱 편집</div>
      <div class="menu-item" id="menuSettings">설정</div>
    </div>
  </div>

  <div class="app-container" id="appCardContainer">
    <div class="app-grid" id="appGrid"></div>
  </div>

  <!-- 나만의 앱 편집 페이지 -->
  <div class="sub-page" id="editLauncherPage">
    <div class="page-header">
      <button class="back-btn" id="closeEditLauncher">&lt;</button>
      <div class="page-title">나만의 앱 편집</div>
    </div>

    <div class="settings-card">
      <div class="setting-item">
        <div class="setting-label">메인 전체 배경색</div>
        <div class="color-row">
          <span style="font-size: 13px; color: #aaa;">바탕 화면 색상</span>
          <input type="color" id="mainBgColorInput" value="#000000">
        </div>
      </div>
      <div class="setting-item">
        <div class="setting-label">앱 상자(카드) 배경색</div>
        <div class="color-row">
          <span style="font-size: 13px; color: #aaa;">앱들이 들어있는 영역 색상</span>
          <input type="color" id="cardBgColorInput" value="#1c1c1e">
        </div>
      </div>
    </div>

    <div class="settings-card">
      <div class="setting-item">
        <div class="setting-label">타이틀 문구</div>
        <input type="text" class="setting-input" id="titleInput" placeholder="보안 폴더">
      </div>
      <div class="setting-item">
        <div class="setting-label">타이틀 색상</div>
        <div class="color-row">
          <span style="font-size: 13px; color: #aaa;">글씨 색상</span>
          <input type="color" id="titleColorInput" value="#ffffff">
        </div>
      </div>
      <div class="setting-item">
        <div class="setting-label">타이틀 글씨 크기 (px)</div>
        <input type="number" class="setting-input" id="titleSizeInput" value="32" min="16" max="60">
      </div>
    </div>

    <div class="settings-card">
      <div class="setting-item" style="cursor: pointer;" id="saveThemeBtn">
        <div class="setting-label" style="color: #0a84ff; text-align: center;">설정 저장 및 적용</div>
      </div>
    </div>
  </div>

  <!-- 설정 페이지 -->
  <div class="sub-page" id="settingsPage">
    <div class="page-header">
      <button class="back-btn" id="closeSettings">&lt;</button>
      <div class="page-title">설정</div>
    </div>

    <div class="settings-card">
      <div class="setting-item" id="setLockBtn" style="cursor: pointer;">
        <div class="setting-label">전체 앱 잠금 설정 (PIN)</div>
        <div class="setting-desc" id="lockStatusText">미사용</div>
      </div>
    </div>

    <div class="settings-card">
      <div class="setting-item" id="exportDataBtn" style="cursor: pointer;">
        <div class="setting-label">백업 데이터 내보내기</div>
        <div class="setting-desc">JSON 파일로 저장</div>
      </div>
      <div class="setting-item" id="importDataBtn" style="cursor: pointer;">
        <div class="setting-label">백업 데이터 복원</div>
        <div class="setting-desc">JSON 파일에서 불러오기</div>
        <input type="file" id="fileInput" accept=".json, application/json, text/plain, */*" style="display: none;">
      </div>
    </div>
  </div>

  <!-- 앱 등록 및 수정 모달 -->
  <div class="modal-overlay" id="addModal">
    <div class="modal">
      <div class="modal-title" id="modalTitleText">새 웹앱 추가</div>
      
      <div style="margin-bottom: 12px;">
        <label style="font-size: 12px; color: #aaa; display:block; margin-bottom:4px;">앱 이름</label>
        <input type="text" class="setting-input" id="appName" placeholder="예: 계산기">
      </div>
      
      <div style="margin-bottom: 12px;">
        <label style="font-size: 12px; color: #aaa; display:block; margin-bottom:4px;">파일 주소 / 경로</label>
        <input type="text" class="setting-input" id="appUrl" placeholder="예: cal.html">
      </div>

      <div style="margin-bottom: 12px;">
        <label style="font-size: 12px; color: #aaa; display:block; margin-bottom:4px;">아이콘 문구 (최대 2자)</label>
        <input type="text" class="setting-input" id="appIconText" maxlength="2" placeholder="예: CA (미입력시 자동)">
      </div>

      <!-- 개별 앱 잠금 설정 영역 -->
      <div style="border-top: 1px solid #444; margin-top: 12px; padding-top: 12px;">
        <div class="switch-row" style="margin-bottom: 8px;">
          <span style="font-size: 13px; color: #eee; font-weight: 600;">개별 비밀번호 사용</span>
          <label class="switch">
            <input type="checkbox" id="appLockToggle">
            <span class="slider"></span>
          </label>
        </div>
        <div id="appPinContainer" style="display: none; margin-top: 8px;">
          <label style="font-size: 12px; color: #aaa; display:block; margin-bottom:4px;">앱 비밀번호 (PIN)</label>
          <input type="password" class="setting-input" id="appPinInput" placeholder="비밀번호 입력">
        </div>
      </div>

      <div style="border-top: 1px solid #444; margin-top: 12px; padding-top: 12px;">
        <div class="color-row" style="margin-bottom: 8px;">
          <span style="font-size: 13px; color: #eee;">앱 아이콘 배경색</span>
          <input type="color" id="appBgColor" value="#3a3d40">
        </div>
        <div class="color-row" style="margin-bottom: 8px;">
          <span style="font-size: 13px; color: #eee;">앱 아이콘 글씨색</span>
          <input type="color" id="appTextColor" value="#ffffff">
        </div>
        <div>
          <label style="font-size: 12px; color: #aaa; display:block; margin-bottom:4px;">앱 아이콘 글씨 크기 (px)</label>
          <input type="number" class="setting-input" id="appFontSize" value="19" min="10" max="32">
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-cancel" id="closeAddModal">취소</button>
        <button class="btn btn-submit" id="saveAppBtn">저장</button>
      </div>
    </div>
  </div>

  <!-- 메인 비밀번호 및 개별 앱 비밀번호 입력 모달 -->
  <div class="modal-overlay" id="lockModal">
    <div class="modal">
      <div class="modal-title" id="lockModalTitle">비밀번호 입력</div>
      <input type="password" class="setting-input" id="pinInput" placeholder="PIN 번호" style="margin-bottom:10px;">
      <div class="btn-group">
        <button class="btn btn-cancel" id="closeLockModalBtn" style="display: none;">취소</button>
        <button class="btn btn-submit" id="submitPinBtn">확인</button>
      </div>
    </div>
  </div>

  <script>
    const defaultApps = [
      { id: 1, name: '계산기', url: 'cal.html', iconText: 'CA', bgColor: '#3a3d40', textColor: '#ffffff', fontSize: 19, lockEnabled: false, pin: '' },
      { id: 2, name: '메모장', url: 'note.html', iconText: 'NO', bgColor: '#3a3d40', textColor: '#ffffff', fontSize: 19, lockEnabled: false, pin: '' }
    ];

    let apps = JSON.parse(localStorage.getItem('apps_data_v5')) || defaultApps;
    let config = JSON.parse(localStorage.getItem('app_config_v5')) || {
      mainBgColor: '#000000',
      cardBgColor: '#1c1c1e',
      title: '보안 폴더',
      titleColor: '#ffffff',
      titleSize: 32,
      pin: ''
    };

    let isEditing = false;
    let isAuthenticated = false;
    let editingAppId = null;
    let pendingAppUrl = null;
    let pendingAppPin = null;

    const mainTitleDisplay = document.getElementById('mainTitleDisplay');
    const appCardContainer = document.getElementById('appCardContainer');
    const appGrid = document.getElementById('appGrid');
    const dropdownMenu = document.getElementById('dropdownMenu');

    function applyConfig() {
      document.body.style.backgroundColor = config.mainBgColor;
      appCardContainer.style.backgroundColor = config.cardBgColor;
      
      mainTitleDisplay.textContent = config.title;
      mainTitleDisplay.style.color = config.titleColor;
      mainTitleDisplay.style.fontSize = config.titleSize + 'px';

      document.getElementById('mainBgColorInput').value = config.mainBgColor;
      document.getElementById('cardBgColorInput').value = config.cardBgColor;
      document.getElementById('titleInput').value = config.title;
      document.getElementById('titleColorInput').value = config.titleColor;
      document.getElementById('titleSizeInput').value = config.titleSize;

      document.getElementById('lockStatusText').textContent = config.pin ? 'PIN 설정됨' : '미사용';

      renderApps();
    }

    function renderApps() {
      appGrid.innerHTML = '';
      apps.forEach((app, index) => {
        const item = document.createElement('div');
        item.className = `app-item ${isEditing ? 'editing' : ''}`;
        
        const text = app.iconText || app.name.slice(0, 2).toUpperCase();
        const bgColor = app.bgColor || '#3a3d40';
        const textColor = app.textColor || '#ffffff';
        const fontSize = (app.fontSize || 19) + 'px';
        const isLocked = app.lockEnabled && app.pin;

        item.innerHTML = `
          <div class="app-icon" style="background: ${bgColor}; color: ${textColor}; font-size: ${fontSize};">
            ${text}
            ${isLocked ? '<span class="app-lock-indicator">🔒</span>' : ''}
          </div>
          <div class="app-name">${app.name}</div>
          <div class="edit-badge">✏️</div>
          <div class="delete-badge">✕</div>
          <div class="reorder-controls">
            <button class="reorder-btn move-left">◀</button>
            <button class="reorder-btn move-right">▶</button>
          </div>
        `;

        // 앱 실행 (개별 비밀번호 확인)
        item.querySelector('.app-icon').addEventListener('click', () => {
          if (!isEditing) {
            if (app.lockEnabled && app.pin) {
              pendingAppUrl = app.url;
              pendingAppPin = app.pin;
              document.getElementById('lockModalTitle').textContent = `${app.name} 비밀번호`;
              document.getElementById('pinInput').value = '';
              document.getElementById('closeLockModalBtn').style.display = 'block';
              document.getElementById('lockModal').classList.add('active');
            } else {
              window.location.href = app.url;
            }
          }
        });

        // 수정
        item.querySelector('.edit-badge').addEventListener('click', (e) => {
          e.stopPropagation();
          openEditModal(app);
        });

        // 삭제
        item.querySelector('.delete-badge').addEventListener('click', (e) => {
          e.stopPropagation();
          apps.splice(index, 1);
          saveApps();
          renderApps();
        });

        // 순서 변경
        item.querySelector('.move-left').addEventListener('click', (e) => {
          e.stopPropagation();
          if (index > 0) {
            const temp = apps[index];
            apps[index] = apps[index - 1];
            apps[index - 1] = temp;
            saveApps();
            renderApps();
          }
        });

        item.querySelector('.move-right').addEventListener('click', (e) => {
          e.stopPropagation();
          if (index < apps.length - 1) {
            const temp = apps[index];
            apps[index] = apps[index + 1];
            apps[index + 1] = temp;
            saveApps();
            renderApps();
          }
        });

        appGrid.appendChild(item);
      });
    }

    function saveApps() {
      localStorage.setItem('apps_data_v5', JSON.stringify(apps));
    }

    function saveConfig() {
      localStorage.setItem('app_config_v5', JSON.stringify(config));
      applyConfig();
    }

    document.getElementById('menuBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('show');
    });

    document.addEventListener('click', () => dropdownMenu.classList.remove('show'));

    document.getElementById('menuToggleEdit').addEventListener('click', () => {
      isEditing = !isEditing;
      renderApps();
    });

    document.getElementById('menuEditLauncher').addEventListener('click', () => {
      document.getElementById('editLauncherPage').classList.add('active');
    });

    document.getElementById('closeEditLauncher').addEventListener('click', () => {
      document.getElementById('editLauncherPage').classList.remove('active');
    });

    document.getElementById('saveThemeBtn').addEventListener('click', () => {
      config.mainBgColor = document.getElementById('mainBgColorInput').value;
      config.cardBgColor = document.getElementById('cardBgColorInput').value;
      config.title = document.getElementById('titleInput').value.trim() || '보안 폴더';
      config.titleColor = document.getElementById('titleColorInput').value;
      config.titleSize = document.getElementById('titleSizeInput').value || 32;
      
      saveConfig();
      document.getElementById('editLauncherPage').classList.remove('active');
    });

    document.getElementById('menuSettings').addEventListener('click', () => {
      document.getElementById('settingsPage').classList.add('active');
    });

    document.getElementById('closeSettings').addEventListener('click', () => {
      document.getElementById('settingsPage').classList.remove('active');
    });

    // 개별 비밀번호 스위치 토글 이벤트
    const appLockToggle = document.getElementById('appLockToggle');
    const appPinContainer = document.getElementById('appPinContainer');
    
    appLockToggle.addEventListener('change', (e) => {
      appPinContainer.style.display = e.target.checked ? 'block' : 'none';
    });

    // 신규 모달
    document.getElementById('addBtn').addEventListener('click', () => {
      editingAppId = null;
      document.getElementById('modalTitleText').textContent = '새 웹앱 추가';
      document.getElementById('appName').value = '';
      document.getElementById('appUrl').value = '';
      document.getElementById('appIconText').value = '';
      document.getElementById('appBgColor').value = '#3a3d40';
      document.getElementById('appTextColor').value = '#ffffff';
      document.getElementById('appFontSize').value = 19;
      
      appLockToggle.checked = false;
      appPinContainer.style.display = 'none';
      document.getElementById('appPinInput').value = '';
      
      document.getElementById('addModal').classList.add('active');
    });

    // 수정 모달
    function openEditModal(app) {
      editingAppId = app.id;
      document.getElementById('modalTitleText').textContent = '웹앱 정보 수정';
      document.getElementById('appName').value = app.name;
      document.getElementById('appUrl').value = app.url;
      document.getElementById('appIconText').value = app.iconText || '';
      document.getElementById('appBgColor').value = app.bgColor || '#3a3d40';
      document.getElementById('appTextColor').value = app.textColor || '#ffffff';
      document.getElementById('appFontSize').value = app.fontSize || 19;
      
      appLockToggle.checked = !!app.lockEnabled;
      appPinContainer.style.display = app.lockEnabled ? 'block' : 'none';
      document.getElementById('appPinInput').value = app.pin || '';
      
      document.getElementById('addModal').classList.add('active');
    }

    document.getElementById('closeAddModal').addEventListener('click', () => {
      document.getElementById('addModal').classList.remove('active');
    });

    // 앱 정보 저장
    document.getElementById('saveAppBtn').addEventListener('click', () => {
      const name = document.getElementById('appName').value.trim();
      const url = document.getElementById('appUrl').value.trim();
      let iconText = document.getElementById('appIconText').value.trim().toUpperCase();
      const bgColor = document.getElementById('appBgColor').value;
      const textColor = document.getElementById('appTextColor').value;
      const fontSize = parseInt(document.getElementById('appFontSize').value) || 19;
      
      const lockEnabled = appLockToggle.checked;
      const pin = document.getElementById('appPinInput').value.trim();

      if (!name || !url) return alert('이름과 주소를 입력해주세요.');
      if (lockEnabled && !pin) return alert('개별 비밀번호를 입력해주세요.');
      if (!iconText) iconText = name.slice(0, 2).toUpperCase();

      if (editingAppId) {
        const targetApp = apps.find(a => a.id === editingAppId);
        if (targetApp) {
          targetApp.name = name;
          targetApp.url = url;
          targetApp.iconText = iconText;
          targetApp.bgColor = bgColor;
          targetApp.textColor = textColor;
          targetApp.fontSize = fontSize;
          targetApp.lockEnabled = lockEnabled;
          targetApp.pin = pin;
        }
      } else {
        apps.push({ id: Date.now(), name, url, iconText, bgColor, textColor, fontSize, lockEnabled, pin });
      }

      saveApps();
      renderApps();
      document.getElementById('addModal').classList.remove('active');
    });

    // 전체 PIN 설정
    document.getElementById('setLockBtn').addEventListener('click', () => {
      const pin = prompt('사용할 PIN 번호를 입력하세요 (취소 시 잠금 해제):');
      if (pin !== null) {
        config.pin = pin.trim();
        saveConfig();
        alert(config.pin ? '전체 비밀번호가 설정되었습니다.' : '전체 비밀번호 잠금이 해제되었습니다.');
      }
    });

    // 백업
    document.getElementById('exportDataBtn').addEventListener('click', () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ apps, config }));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "launcher_backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    });

    // 복원
    document.getElementById('importDataBtn').addEventListener('click', () => {
      document.getElementById('fileInput').click();
    });

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(event) {
        try {
          const imported = JSON.parse(event.target.result);
          if (imported.apps && imported.config) {
            apps = imported.apps;
            config = imported.config;
            saveApps();
            saveConfig();
            alert('데이터 복원이 완료되었습니다!');
          }
        } catch (err) {
          alert('올바른 백업 파일이 아닙니다.');
        }
      };
      reader.readAsText(file);
    });

    // 전체 잠금 체크
    function checkLock() {
      if (config.pin && !isAuthenticated) {
        document.getElementById('lockModalTitle').textContent = '비밀번호 입력';
        document.getElementById('closeLockModalBtn').style.display = 'none';
        document.getElementById('lockModal').classList.add('active');
      }
    }

    // 비밀번호 입력 처리 (전체 PIN 및 개별 앱 PIN 통합)
    document.getElementById('submitPinBtn').addEventListener('click', () => {
      const inputPin = document.getElementById('pinInput').value;

      // 개별 앱 실행 검증 중인 경우
      if (pendingAppUrl) {
        if (inputPin === pendingAppPin) {
          const targetUrl = pendingAppUrl;
          pendingAppUrl = null;
          pendingAppPin = null;
          document.getElementById('lockModal').classList.remove('active');
          window.location.href = targetUrl;
        } else {
          alert('비밀번호가 일치하지 않습니다.');
        }
        return;
      }

      // 전체 앱 잠금 검증 중인 경우
      if (inputPin === config.pin) {
        isAuthenticated = true;
        document.getElementById('lockModal').classList.remove('active');
      } else {
        alert('비밀번호가 일치하지 않습니다.');
      }
    });

    document.getElementById('closeLockModalBtn').addEventListener('click', () => {
      pendingAppUrl = null;
      pendingAppPin = null;
      document.getElementById('lockModal').classList.remove('active');
    });

    applyConfig();
    checkLock();
  </script>
</body>
</html>
