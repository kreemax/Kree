<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-GEN</title>
  <style>
    :root { --bg: #000; --card: #111; --text: #fff; --sub: #555; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding: 12px; max-width: 480px; margin: auto; }
    
    /* App Title Header */
    #app-title-container { text-align: center; margin-bottom: 15px; }
    #app-title { font-weight: bold; color: #fff; font-size: 20px; line-height: 1.2; word-break: break-word; }

    .section { margin-bottom: 18px; }
    .label-header { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .label-title-row { display: flex; justify-content: space-between; align-items: center; }
    .label { font-size: 10px; color: var(--sub); letter-spacing: 2px; }
    
    /* UI Components */
    select, input { width: 100%; background: var(--card); border: 1px solid #333; color: #fff; padding: 8px 10px; border-radius: 4px; font-size: 13px; margin-bottom: 5px; }
    input[type="color"] { padding: 2px; height: 34px; cursor: pointer; }

    /* Compact Switch Grid (10 Columns for 150 EA) */
    .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
    .sw { background: var(--card); border: 1px solid #222; color: var(--sub); padding: 5px 0; font-size: 8px; cursor: pointer; text-align: center; border-radius: 2px; }
    .sw.on { background: #fff; color: #000; border-color: #fff; font-weight: bold; }
    
    /* Mini Switch Control Buttons */
    .sw-ctrls { display: flex; flex-wrap: wrap; gap: 3px; }
    .btn-mini { background: #1a1a1a; border: 1px solid #333; color: #aaa; font-size: 9px; padding: 3px 4px; border-radius: 2px; cursor: pointer; flex: 1 1 calc(16.66% - 3px); text-align: center; min-width: 45px; }
    .btn-mini:hover { color: #fff; border-color: #666; background: #222; }

    .btn { width: 100%; padding: 12px; background: #fff; color: #000; border: none; font-weight: bold; margin-top: 8px; cursor: pointer; border-radius: 2px; }
    .btn-sub-group { display: flex; gap: 5px; margin-top: 8px; }
    .btn-sub { background: #222; color: #ccc; border: 1px solid #444; padding: 10px; font-size: 11px; }
    .btn-reset { background: #222; color: #ff5555; border: 1px solid #444; margin-top: 5px; }
    .menu-link { display: block; text-align: center; color: var(--sub); font-size: 11px; margin-top: 15px; text-decoration: underline; cursor: pointer; }
    
    /* Scroll Box for Settings */
    .scroll-list { max-height: 220px; overflow-y: auto; padding-right: 5px; margin-bottom: 12px; border: 1px solid #222; padding: 5px; border-radius: 4px; }
    .scroll-list::-webkit-scrollbar { width: 4px; }
    .scroll-list::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

    /* Result Row & Copy Button */
    #output { margin-top: 15px; font-size: 12px; word-break: break-all; line-height: 1.5; }
    .res-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 8px; background: #111; border: 1px solid #333; border-radius: 4px; }
    .res-text { flex: 1; word-break: break-all; color: #ffffff; font-weight: bold; font-size: 13px; }
    .btn-copy { background: #333; border: 1px solid #555; color: #fff; font-size: 10px; padding: 6px 10px; border-radius: 3px; cursor: pointer; flex-shrink: 0; font-weight: bold; }
    .btn-copy:active { background: #fff; color: #000; }

    /* Settings View */
    .hidden { display: none; }
    .edit-row { display: flex; gap: 5px; margin-bottom: 5px; align-items: center; }
    .edit-row span { width: 30px; font-size: 10px; color: var(--sub); text-align: right; padding-right: 5px; flex-shrink: 0; }
    .title-setting-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 5px; margin-bottom: 15px; }
  </style>
</head>
<body>

<!-- 상단 중앙 타이틀 -->
<div id="app-title-container">
  <div id="app-title">K-GEN</div>
</div>

<!-- 메인 화면 -->
<div id="main">
  <div class="section">
    <div class="label">SOURCE</div>
    <select id="source-select"></select>
  </div>

  <div class="section">
    <div class="label-header">
      <div class="label-title-row">
        <div class="label">LOGIC SWITCHES (1-150)</div>
      </div>
      <!-- 스위치 제어 버튼 그룹 -->
      <div class="sw-ctrls">
        <button class="btn-mini" onclick="setSwitches('all_on')">ALL ON</button>
        <button class="btn-mini" onclick="setSwitches('all_off')">ALL OFF</button>
        <button class="btn-mini" onclick="setSwitches('odd_on')">홀수 ON</button>
        <button class="btn-mini" onclick="setSwitches('odd_off')">홀수 OFF</button>
        <button class="btn-mini" onclick="setSwitches('even_on')">짝수 ON</button>
        <button class="btn-mini" onclick="setSwitches('even_off')">짝수 OFF</button>
        <button class="btn-mini" onclick="setSwitches('369_on')">369 ON</button>
        <button class="btn-mini" onclick="setSwitches('369_off')">369 OFF</button>
        <button class="btn-mini" onclick="setSwitches('1_on')">1 ON</button>
        <button class="btn-mini" onclick="setSwitches('1_off')">1 OFF</button>
        <button class="btn-mini" onclick="setSwitches('0_on')">0 ON</button>
        <button class="btn-mini" onclick="setSwitches('0_off')">0 OFF</button>
      </div>
    </div>
    <div class="grid" id="switch-grid"></div>
  </div>

  <div class="section">
    <div class="label">MULTIPLIER</div>
    <input type="number" id="multiplier" value="1">
    <button class="btn" onclick="run()">GENERATE</button>
  </div>

  <div id="output"></div>
  <div class="menu-link" onclick="toggleSettings()">설정 (소스/식/타이틀 편집)</div>
</div>

<!-- 설정 화면 -->
<div id="settings" class="hidden">
  <div class="label" style="margin-bottom:8px;">TITLE CONFIG</div>
  <div class="title-setting-grid">
    <input type="text" id="title-text-input" placeholder="타이틀 문구">
    <input type="color" id="title-color-input" value="#ffffff">
    <input type="number" id="title-size-input" placeholder="크기(px)" value="20">
  </div>

  <div class="label" style="margin-bottom:8px;">SOURCES (100 EA)</div>
  <div class="scroll-list" id="source-list-edit"></div>
  
  <div class="label" style="margin-bottom:8px; margin-top:15px;">FORMULAS (Editable: 1-95 / Fixed: 96-150)</div>
  <div class="scroll-list" id="formula-list-edit"></div>
  
  <button class="btn" onclick="saveSettings()">저장하고 나가기</button>
  
  <div class="btn-sub-group">
    <button class="btn btn-sub" onclick="exportJSON()">JSON 백업</button>
    <button class="btn btn-sub" onclick="document.getElementById('json-file-input').click()">JSON 복원</button>
  </div>
  <input type="file" id="json-file-input" class="hidden" accept=".json" onchange="importJSON(event)">

  <button class="btn btn-reset" onclick="resetToDefault()">초기값으로 전체 리셋</button>
</div>

<script>
  const defaultTitleConfig = { text: 'K-GEN', color: '#ffffff', size: '20' };

  const defaultSources = Array.from({ length: 100 }, (_, i) => {
    if (i === 0) return { n: '스마트폰', v: '1234' };
    if (i === 1) return { n: 'Veracrypt', v: '1838' };
    if (i === 2) return { n: '도어락', v: '1323235' };
    if (i === 3) return { n: '신용카드', v: '5678' };
    if (i === 4) return { n: '계좌비밀번호', v: '9101' };
    if (i === 5) return { n: '생년월일', v: '19950814' };
    if (i === 6) return { n: '서버 PIN', v: '432109' };
    if (i === 7) return { n: 'OTP 시드', v: '876543' };
    if (i === 8) return { n: '보안카드', v: '24680' };
    if (i === 9) return { n: '마스터키', v: '135791' };
    return { n: `소스 ${i + 1}`, v: `${1000 + i * 17}` };
  });

  function generateRandomFormulas(count = 95) {
    const ops = ['+', '-', '*'];
    const list = [];
    for(let i = 0; i < count; i++) {
      const op = ops[Math.floor(Math.random() * ops.length)];
      const val = Math.floor(Math.random() * 899) + 10;
      const type = i % 4;
      
      if(type === 0) list.push(`n ${op} ${val}n`);
      else if(type === 1) list.push(`(n ${op} ${val}n) * 2n`);
      else if(type === 2) list.push(`n * ${Math.floor(Math.random() * 8) + 2}n ${op} ${val}n`);
      else list.push(`(n + ${val}n) - ${Math.floor(val / 2)}n`);
    }
    return list;
  }

  // 101~150번: 스위치 1개당 특정 숫자 1개만 특정 문자로 1:1 변환 규칙
  const charPool = ['@', '#', '$', '%', '^', '&', '*', 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K', 'L', 'M', 'N', 'P', 'Q', 'R', 'S', 'T', 'U', 'V', 'W', 'X', 'Y', 'Z', 'a', 'b', 'c', 'd', 'e', 'f', 'g', 'h', 'i', 'j', 'k', 'm', 'n', 'p', 'q', 'r', 's', 't'];

  function getSingleReplaceRule(swNum) {
    const idx = swNum - 101;
    const targetDigit = (Math.floor(idx / 5) + 1).toString();
    const replacementChar = charPool[idx % charPool.length];
    return { target: targetDigit, replacement: replacementChar };
  }

  // 데이터 로드 (v14)
  let titleConfig = JSON.parse(localStorage.getItem('k_title_v14')) || defaultTitleConfig;
  let sources = JSON.parse(localStorage.getItem('k_src_v14')) || defaultSources;
  let formulas = JSON.parse(localStorage.getItem('k_fml_v14'));
  if (!formulas || formulas.length < 95) {
    formulas = generateRandomFormulas(95);
  }

  function applyTitleSettings() {
    const titleEl = document.getElementById('app-title');
    titleEl.textContent = titleConfig.text || 'K-GEN';
    titleEl.style.color = titleConfig.color || '#ffffff';
    titleEl.style.fontSize = (titleConfig.size || '20') + 'px';
  }

  function init() {
    applyTitleSettings();

    const sSelect = document.getElementById('source-select');
    sSelect.innerHTML = sources
      .filter(s => s.n.trim() !== '')
      .map(s => `<option value="${s.v}">${s.n}</option>`)
      .join('');
    
    // 기본 ON 스위치 번호 지정
    const defaultOnSwitches = new Set([101, 111, 121, 131, 141]);

    // 150개 스위치 생성 및 초기 기본값 설정
    const grid = document.getElementById('switch-grid');
    grid.innerHTML = '';
    for(let i=0; i<150; i++) {
      const swNum = i + 1;
      const b = document.createElement('div');
      b.className = 'sw';
      b.textContent = swNum;
      
      // 1~100번 및 지정된 스위치(101, 111, 121, 131, 141) 초기 ON 처리
      if (swNum <= 100 || defaultOnSwitches.has(swNum)) {
        b.classList.add('on');
      }

      b.onclick = () => b.classList.toggle('on');
      grid.appendChild(b);
    }
  }

  function setSwitches(type) {
    const btns = document.querySelectorAll('.sw');
    btns.forEach((b, i) => {
      const num = i + 1;
      const strNum = num.toString();

      if (type === 'all_on') b.classList.add('on');
      else if (type === 'all_off') b.classList.remove('on');
      else if (type === 'odd_on' && num % 2 !== 0) b.classList.add('on');
      else if (type === 'odd_off' && num % 2 !== 0) b.classList.remove('on');
      else if (type === 'even_on' && num % 2 === 0) b.classList.add('on');
      else if (type === 'even_off' && num % 2 === 0) b.classList.remove('on');
      else if (type === '369_on' && (strNum.includes('3') || strNum.includes('6') || strNum.includes('9'))) b.classList.add('on');
      else if (type === '369_off' && (strNum.includes('3') || strNum.includes('6') || strNum.includes('9'))) b.classList.remove('on');
      else if (type === '1_on' && strNum.includes('1')) b.classList.add('on');
      else if (type === '1_off' && strNum.includes('1')) b.classList.remove('on');
      else if (type === '0_on' && strNum.includes('0')) b.classList.add('on');
      else if (type === '0_off' && strNum.includes('0')) b.classList.remove('on');
    });
  }

  function toggleSettings() {
    document.getElementById('main').classList.toggle('hidden');
    document.getElementById('settings').classList.toggle('hidden');
    if(!document.getElementById('settings').classList.contains('hidden')) {
      renderSettings();
    }
  }

  function renderSettings() {
    document.getElementById('title-text-input').value = titleConfig.text || 'K-GEN';
    document.getElementById('title-color-input').value = titleConfig.color || '#ffffff';
    document.getElementById('title-size-input').value = titleConfig.size || '20';

    const sEdit = document.getElementById('source-list-edit');
    let htmlSrc = '';
    for(let i = 0; i < 100; i++) {
      const nameVal = sources[i] ? sources[i].n : '';
      const numVal = sources[i] ? sources[i].v : '';
      htmlSrc += `<div class="edit-row"><span>${i+1}</span><input value="${nameVal}" id="sn-${i}" placeholder="이름"><input value="${numVal}" id="sv-${i}" placeholder="값"></div>`;
    }
    sEdit.innerHTML = htmlSrc;
    
    // 수식 목록 (1~95 편집 가능, 96~150 고정)
    const fEdit = document.getElementById('formula-list-edit');
    let htmlFml = '';
    for(let i = 1; i <= 150; i++) {
      if (i >= 96 && i <= 100) {
        let label = "";
        if(i === 96) label = "[고정] 숫자 뒤집기 (Reverse)";
        if(i === 97) label = "[고정] 홀수시 0추가 후 반전 교차";
        if(i === 98) label = "[고정] 앞뒤에 9 추가";
        if(i === 99) label = "[고정] 2번 반복 (1234 -> 12341234)";
        if(i === 100) label = "[고정] 3번 반복 (1234 -> 123412341234)";
        htmlFml += `<div class="edit-row"><span>${i}</span><input value="${label}" disabled style="color:#666; background:#1a1a1a; border-color:#222;"></div>`;
      } else if (i >= 101 && i <= 150) {
        const rule = getSingleReplaceRule(i);
        const preview = `[고정] 숫자 '${rule.target}' -> '${rule.replacement}' 변경`;
        htmlFml += `<div class="edit-row"><span>${i}</span><input value="${preview}" disabled style="color:#666; background:#1a1a1a; border-color:#222;"></div>`;
      } else {
        const fIdx = i - 1;
        const fVal = formulas[fIdx] || 'n * 2n';
        htmlFml += `<div class="edit-row"><span>${i}</span><input value="${fVal}" id="f-${fIdx}"></div>`;
      }
    }
    fEdit.innerHTML = htmlFml;
  }

  function saveSettings() {
    titleConfig = {
      text: document.getElementById('title-text-input').value || 'K-GEN',
      color: document.getElementById('title-color-input').value || '#ffffff',
      size: document.getElementById('title-size-input').value || '20'
    };

    const newSources = [];
    for(let i = 0; i < 100; i++) {
      newSources.push({
        n: document.getElementById(`sn-${i}`).value,
        v: document.getElementById(`sv-${i}`).value
      });
    }
    
    const newFormulas = [];
    for(let i = 0; i < 95; i++) {
      const inputEl = document.getElementById(`f-${i}`);
      newFormulas.push(inputEl ? inputEl.value : 'n * 2n');
    }

    sources = newSources;
    formulas = newFormulas;
    
    localStorage.setItem('k_title_v14', JSON.stringify(titleConfig));
    localStorage.setItem('k_src_v14', JSON.stringify(sources));
    localStorage.setItem('k_fml_v14', JSON.stringify(formulas));
    
    alert('저장되었습니다.');
    location.reload();
  }

  function exportJSON() {
    const data = { titleConfig, sources, formulas };
    const jsonStr = JSON.stringify(data, null, 2);
    const blob = new Blob([jsonStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `kgen_backup_${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importJSON(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const importedData = JSON.parse(e.target.result);
        if (importedData.titleConfig) titleConfig = importedData.titleConfig;
        if (importedData.sources && Array.isArray(importedData.sources)) sources = importedData.sources;
        if (importedData.formulas && Array.isArray(importedData.formulas)) formulas = importedData.formulas;
        
        localStorage.setItem('k_title_v14', JSON.stringify(titleConfig));
        localStorage.setItem('k_src_v14', JSON.stringify(sources));
        localStorage.setItem('k_fml_v14', JSON.stringify(formulas));
        
        alert('성공적으로 복원되었습니다.');
        location.reload();
      } catch (err) {
        alert('유효하지 않은 JSON 데이터입니다.');
      }
    };
    reader.readAsText(file);
  }

  function resetToDefault() {
    if(confirm('모든 데이터를 삭제하고 초기 상태로 리셋할까요?')) {
      for(let i=1; i<=14; i++) {
        localStorage.removeItem(`k_title_v${i}`);
        localStorage.removeItem(`k_src_v${i}`);
        localStorage.removeItem(`k_fml_v${i}`);
      }
      localStorage.removeItem('k_src');
      localStorage.removeItem('k_fml');
      location.reload();
    }
  }

  // 앞에서부터 4자리씩 하이픈(-) 추가 함수
  function formatHyphen(str) {
    const isNegative = str.startsWith('-');
    const cleanStr = isNegative ? str.slice(1) : str;
    const match = cleanStr.match(/.{1,4}/g);
    const formatted = match ? match.join('-') : cleanStr;
    return (isNegative ? '-' : '') + formatted;
  }

  // 하이픈 제외 복사 기능 함수
  function copyWithoutHyphen(rawStr, btnEl) {
    const cleanText = rawStr.replace(/-/g, '');
    navigator.clipboard.writeText(cleanText).then(() => {
      const origText = btnEl.textContent;
      btnEl.textContent = '복사됨!';
      setTimeout(() => btnEl.textContent = origText, 1200);
    }).catch(err => {
      alert('복사 실패');
    });
  }

  function run() {
    const selectVal = document.getElementById('source-select').value;
    if(!selectVal) return;
    
    let isStringMode = false;
    let currentValStr = selectVal;
    let n = BigInt(selectVal);
    
    const btns = document.querySelectorAll('.sw');
    
    btns.forEach((b, i) => {
      const swNum = i + 1;
      if(b.classList.contains('on')) {
        if(swNum <= 95 && !isStringMode) {
          try {
            const fn = new Function('n', `return ${formulas[swNum - 1]}`);
            n = fn(n);
            currentValStr = n.toString();
          } catch(e) {}
        } else if(swNum === 96 && !isStringMode) {
          try {
            let str = n.toString();
            const isNeg = str.startsWith('-');
            const clean = isNeg ? str.slice(1) : str;
            n = BigInt((isNeg ? '-' : '') + (clean.split('').reverse().join('') || '0'));
            currentValStr = n.toString();
          } catch(e) {}
        } else if(swNum === 97 && !isStringMode) {
          try {
            let str = n.toString();
            const isNeg = str.startsWith('-');
            let clean = isNeg ? str.slice(1) : str;
            if (n % 2n !== 0n) clean += '0';
            const mid = Math.floor(clean.length / 2);
            n = BigInt((isNeg ? '-' : '') + ((clean.slice(mid) + clean.slice(0, mid)) || '0'));
            currentValStr = n.toString();
          } catch(e) {}
        } else if(swNum === 98 && !isStringMode) {
          try {
            let str = n.toString();
            const isNeg = str.startsWith('-');
            n = BigInt((isNeg ? '-' : '') + '9' + (isNeg ? str.slice(1) : str) + '9');
            currentValStr = n.toString();
          } catch(e) {}
        } else if(swNum === 99 && !isStringMode) {
          try {
            let str = n.toString();
            const isNeg = str.startsWith('-');
            const clean = isNeg ? str.slice(1) : str;
            n = BigInt((isNeg ? '-' : '') + clean + clean);
            currentValStr = n.toString();
          } catch(e) {}
        } else if(swNum === 100 && !isStringMode) {
          try {
            let str = n.toString();
            const isNeg = str.startsWith('-');
            const clean = isNeg ? str.slice(1) : str;
            n = BigInt((isNeg ? '-' : '') + clean + clean + clean);
            currentValStr = n.toString();
          } catch(e) {}
        } else if(swNum >= 101 && swNum <= 150) {
          // 101~150번: 스위치 1개당 특정 숫자 1개만 1:1 치환 (문자열 모드 전환)
          isStringMode = true;
          const rule = getSingleReplaceRule(swNum);
          const regex = new RegExp(rule.target, 'g');
          currentValStr = currentValStr.replace(regex, rule.replacement);
        }
      }
    });
    
    // 치환 모드가 아닐 경우 최종 승수(Multiplier) 연산
    if (!isStringMode) {
      const mul = BigInt(document.getElementById('multiplier').value || 1);
      n *= mul;
      currentValStr = n.toString();
    }

    // 결과값 최대 256자 제한
    if (currentValStr.length > 256) {
      currentValStr = currentValStr.substring(0, 256);
    }

    const out = document.getElementById('output');
    out.innerHTML = '';
    
    // 정답 단 1개만 화면에 표시 (흰색 글씨)
    const rowDiv = document.createElement('div');
    rowDiv.className = 'res-row';

    const textSpan = document.createElement('span');
    textSpan.className = 'res-text';
    textSpan.textContent = formatHyphen(currentValStr);

    const copyBtn = document.createElement('button');
    copyBtn.className = 'btn-copy';
    copyBtn.textContent = '복사';
    copyBtn.onclick = () => copyWithoutHyphen(currentValStr, copyBtn);

    rowDiv.appendChild(textSpan);
    rowDiv.appendChild(copyBtn);
    out.appendChild(rowDiv);
  }

  init();
</script>
</body>
</html>
